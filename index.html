<style>
:root{
  --blue:#1877F2; --blue-d:#0B5FD0; --blue-50:#E7F3FF; --blue-100:#D6E8FF; --blue-200:#B4D3FF; --blue-300:#8BBBFF;
  --bg:#F0F2F5; --card:#FFFFFF; --ink:#1C1E21; --ink2:#65676B; --ink3:#8A8D91; --line:#E4E6EB;
  --tip:#FFF6D6; --tip-ink:#5B4300; --tip-line:#F5DE8A; --hl:#FFE58A;
  --hard:#FFEDE0; --hard-ink:#A24A00;
  --ok:#2DA44E; --bad:#E5484D;
  --font: "Hanken Grotesk","IBM Plex Sans Arabic",system-ui,sans-serif;
  --r:24px; --pill:999px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(24,119,242,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#18191A; --card:#242526; --ink:#E4E6EB; --ink2:#B0B3B8; --ink3:#8A8D91; --line:#3A3B3C;
  --blue-50:#1F2F45; --blue-100:#243A57; --blue-200:#2F5487; --blue-300:#4A7CC2;
  --tip:#3A3220; --tip-ink:#F3DE9F; --tip-line:#5A4A20; --hl:#6B5A1C;
  --hard:#3B2A1F; --hard-ink:#FFB27A; --shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-weight:300;color:var(--ink);background:var(--bg);
min-height:100vh;line-height:1.65;font-size:16px}
b,strong,h1,h2,h3{font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.ltr{direction:ltr;unicode-bidi:isolate}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;font-weight:500;padding:0 2px;border-radius:2px}

/* ── shell ── */
.top{position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;align-items:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.logo svg{width:36px;height:36px}
.brand span{font-size:20px!important;font-weight:500}
.mascot{position:absolute;inset-inline-end:26px;top:50%;transform:translateY(-50%);width:120px;height:120px;filter:drop-shadow(0 10px 18px rgba(0,30,80,.25))}
.mascot{background:#fff;border-radius:50%;padding:14px}
.mascot svg{width:100%;height:100%}
@media (max-width:640px){.mascot{padding:8px;width:64px;height:64px;top:20px;inset-inline-end:16px;transform:none}.hero h1{padding-inline-end:70px}}
@media (min-width:641px){.hero{padding-inline-end:170px!important}}
.brand small{display:block;font-size:12px;color:var(--ink2);line-height:1.2}
.brand span{font-weight:500;font-size:17px;line-height:1.25;white-space:nowrap}
.back{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.back svg{width:20px;height:20px}
.toptitle{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.nav{display:none}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink2);padding:4px 14px;border-radius:16px;min-width:76px}
.tab .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--blue);font-weight:500}
.tab.on .ic{background:var(--blue-50)}
main{max-width:1240px;margin:0 auto;padding:6px 16px 110px}

/* ── pieces ── */
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
h1{font-size:28px;line-height:1.3;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.35}
.sub{color:var(--ink2);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--pill);font-size:13px;background:var(--card);border:1px dashed var(--line);color:var(--ink2)}
.sec{margin:28px 4px 12px;font-size:20px;font-weight:500}

.hero{background:linear-gradient(135deg,#1877F2,#3D8DFF 60%,#5AA2FF);color:#fff;border-radius:28px;padding:24px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:27px;max-width:15em}
.hero p{opacity:.92;margin-top:6px;max-width:30em}
.hero .stats{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.18);border-radius:var(--pill);padding:7px 14px;font-size:14px}
.hero .stat b{font-size:16px}
.ring{position:absolute;inset-inline-end:-30px;top:-30px;width:180px;height:180px;opacity:.18}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.how div{background:var(--card);border-radius:20px;padding:14px 12px;font-size:14px;box-shadow:var(--shadow)}
.how i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue-50);color:var(--blue);font-weight:600;margin-bottom:6px}

.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:10px;padding-inline-end:12px;border-radius:var(--pill);background:var(--card);box-shadow:var(--shadow);transition:background .15s}
.row:hover{background:var(--blue-50)}
.row .num{width:54px;height:54px;border-radius:50%;background:var(--blue-50);display:grid;place-items:center;flex:none;color:var(--blue)}
.row .num svg{width:28px;height:28px}
.row .num.t{font-family:"Hanken Grotesk";font-weight:500;font-size:22px}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:17px;line-height:1.35}
.row .txt small{display:block;color:var(--ink2);font-size:13px;text-align:right}
.row .go{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.row .go svg{width:18px;height:18px}
.row.done .go{background:var(--blue);color:#fff}


/* lesson */
.lhead{padding:8px 4px 4px}
.lhead .en{color:var(--ink2);font-size:15px;margin-top:2px}
.summary{display:flex;align-items:center;gap:8px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.summary::-webkit-scrollbar{display:none}
.summary>*{flex:none}
.summary .big{background:var(--blue);color:#fff;border-radius:var(--pill);padding:8px 16px;font-weight:500}
.jump{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:var(--pill);padding:6px 12px 6px 8px;font-size:14px;white-space:nowrap}
.jump i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:600}
.jump.h i{background:var(--hard);color:var(--hard-ink)}
.jump.t i{background:var(--tip);color:var(--tip-ink)}

.idea{margin-top:16px;scroll-margin-top:80px}
.idea .ih{display:flex;align-items:center;gap:12px}
.idea .badge{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:"Hanken Grotesk";font-weight:600;font-size:18px;flex:none}
.idea.hard .badge{background:var(--hard-ink)}
.idea .lab{font-size:12px;color:var(--ink3);line-height:1}
.idea h3{font-size:19px;line-height:1.35}
.idea .d{margin-top:10px;font-size:16.5px}
.ex{margin-top:14px;background:var(--blue-50);border-radius:20px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:center}
.idea.hard .ex{background:color-mix(in srgb,var(--hard) 60%,var(--card))}
.exlab{width:100%;font-size:12px;color:var(--blue);font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.idea.hard .exlab{color:var(--hard-ink)}
.steps{margin-top:12px;display:grid;gap:6px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;font-size:15px}
.steps li:before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue-50);color:var(--blue);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:2px;font-family:"Hanken Grotesk"}
.hardhead{display:flex;align-items:center;gap:10px;margin:30px 4px 0}
.tag{display:inline-block;background:var(--hard);color:var(--hard-ink);border-radius:var(--pill);padding:4px 12px;font-size:13px;font-weight:500}

.tips{margin-top:28px;background:var(--tip);border:1.5px solid var(--tip-line);border-radius:var(--r);padding:20px;scroll-margin-top:80px}
.tips h2{display:flex;align-items:center;gap:10px;color:var(--tip-ink)}
.tips h2 svg{width:26px;height:26px}
.tips ul{margin-top:10px;display:grid;gap:10px}
.tips li{list-style:none;display:flex;gap:10px;font-size:16px}
.tips li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--tip-ink);margin-top:10px;opacity:.6}
.tips mark{background:linear-gradient(transparent 50%,#FFD54A 50%)}
@media (prefers-color-scheme:dark){.tips mark{background:linear-gradient(transparent 50%,#7A6420 50%)}}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:14px}
.words div{background:var(--card);border-radius:14px;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.words .ltr{font-weight:500}

.prac{margin-top:28px}
.q{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow)}
.q .qt{flex:1;font-size:15px}
.q button{flex:none;background:var(--blue-50);color:var(--blue);border-radius:var(--pill);padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.q .ans{display:none;color:var(--ok);font-weight:500}
.q.open .ans{display:block}
.q.open button{display:none}

.foot{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.btn{flex:1;min-width:200px;height:60px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:17px}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:var(--card);box-shadow:var(--shadow)}
.btn.s.on{background:var(--blue-50);color:var(--blue)}
.btn svg{width:20px;height:20px}

/* ── visuals ── */
.vis{background:var(--card);border-radius:16px;padding:12px;max-width:100%;overflow-x:auto}
.vis svg{display:block;max-width:100%;height:auto}
.vcalc{display:flex;flex-direction:column;align-items:center;gap:10px}
.vg{display:grid;direction:ltr;font-family:"Hanken Grotesk";gap:0}
.vg > div{width:50px;height:46px;display:grid;place-items:center;font-size:30px;font-weight:400;position:relative;transition:background .2s,color .2s}
.vg .hd{height:24px;font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.vg .an{height:26px;font-size:15px;color:var(--blue);font-weight:600}
.vg .an.hide,.vg .rs.hide{visibility:hidden}
.vg .op{color:var(--blue);font-size:26px}
.vg .ln{width:auto!important;height:3px;background:var(--ink);border-radius:2px;align-self:center}
.vg .rs{color:var(--blue);font-weight:500}
.vg .col-on{background:var(--blue-50)}
.vg .x{color:var(--ink3)}
.vg .x:after{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;background:var(--bad);transform:rotate(-20deg)}
.vg .tcol{border-inline:1px dashed transparent}
.vctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vctl button{background:var(--blue-50);color:var(--blue);border-radius:var(--pill);padding:7px 14px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.vctl button.p{background:var(--blue);color:#fff}
.vsteps{display:grid;gap:6px;width:100%;max-width:420px}
.vsteps div{font-size:14.5px;padding:7px 12px;border-radius:12px;background:var(--bg);opacity:.45;transition:opacity .2s,background .2s}
.vsteps div.on{opacity:1}
.vsteps .ltr{white-space:nowrap}
.vsteps div.cur{background:var(--blue-50);opacity:1;font-weight:500}
.flow{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:"Hanken Grotesk";direction:ltr;text-align:center}
.flow div{font-size:20px;font-weight:400}
.flow .ar{font-family:var(--font);direction:rtl}
.flow .ar-s{font-size:15px;color:var(--ink2)}
.flow .arr{color:var(--blue-300);font-size:16px;line-height:1}
.flow .hl{color:var(--blue);font-weight:600;background:var(--blue-50);border-radius:8px;padding:0 6px}
table.t{border-collapse:separate;border-spacing:0;direction:ltr;font-family:"Hanken Grotesk";font-size:14px}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);text-align:center;white-space:nowrap}
table.t tr:first-child td{background:var(--blue-50);font-weight:500}
table.t td:first-child{font-weight:500;color:var(--blue)}
table.t tr:last-child td{border-bottom:0}
table.t td:last-child{border-inline-end:0}
.wrong{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;justify-content:center}
.wrong .w{border-radius:16px;padding:10px 16px;text-align:center;min-width:130px}
.wrong .w small{display:block;font-size:12px;font-weight:500}
.wrong .w div{font-family:"Hanken Grotesk";font-size:22px;direction:ltr}
.wrong .no{background:#FDECEC;color:#B42318}
.wrong .yes{background:#E6F6EA;color:#18753A}
@media (prefers-color-scheme:dark){.wrong .no{background:#3A2020;color:#FF9C9C}.wrong .yes{background:#1E3626;color:#86E0A1}}
.wrong p{width:100%;text-align:center;font-size:14px;color:var(--ink2)}
.conv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.conv div{background:var(--card);border-radius:var(--pill);padding:8px 16px;font-family:"Hanken Grotesk";direction:ltr;font-size:16px;box-shadow:var(--shadow)}
.conv b{color:var(--blue)}
.cmp{display:grid;gap:8px}
.cmp div{display:flex;align-items:center;gap:12px;justify-content:center;font-family:"Hanken Grotesk";direction:ltr;font-size:20px}
.cmp i{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:600}
.cmp span{background:var(--card);border-radius:12px;padding:4px 14px;min-width:70px;text-align:center}
.bar{width:100%;max-width:420px;direction:ltr;font-family:"Hanken Grotesk"}
.bar .b{height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;gap:6px}
.bar .tot{background:var(--blue);color:#fff}
.bar .parts{display:flex;gap:6px;margin-top:6px}
.bar .pt{background:var(--card);border:2px solid var(--blue-200)}
.bar .pt.q{border-style:dashed;border-color:var(--blue);color:var(--blue);font-weight:600}
.bar small{opacity:.8}
.us{display:grid;direction:ltr;font-family:"Hanken Grotesk";grid-template-columns:34px 80px 80px;gap:4px;text-align:center;font-size:24px}
.us .h{font-size:12px;color:var(--ink3);font-weight:500}
.us .ln{grid-column:2/4;height:3px;background:var(--ink);border-radius:2px}
.us .r{color:var(--blue);font-weight:500}
.us .o{color:var(--blue)}
.pv{display:grid;grid-template-columns:repeat(3,72px);direction:ltr;font-family:"Hanken Grotesk";text-align:center;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pv div{padding:6px;font-size:22px;background:var(--card)}
.pv .h{font-size:11px;background:var(--blue-50);color:var(--blue);font-weight:500;text-transform:uppercase}
.pv .n{grid-column:1/4;background:var(--blue);color:#fff;font-weight:500}
.pvop{display:flex;align-items:center;gap:8px;direction:ltr;flex-wrap:wrap;justify-content:center;font-family:"Hanken Grotesk"}
.pvop .s{font-size:24px;color:var(--blue)}
.pvop .pv{grid-template-columns:repeat(3,52px)}
.pvop .pv div{font-size:18px}
.split{direction:ltr;font-family:"Hanken Grotesk";text-align:center}
.split .top{position:static;display:block;font-size:24px;background:none;backdrop-filter:none;padding:0}
.split svg{display:block;margin:0 auto}
.cap{text-align:center;font-size:13px;color:var(--ink2);margin-top:6px;font-family:"Hanken Grotesk"}

/* chapter page */
.chead{display:flex;gap:16px;align-items:center;padding:8px 4px}
.chead .big{width:72px;height:72px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.chead .big svg{width:36px;height:36px}

/* notes page */
.nchap{margin-top:22px}
.nles{background:var(--tip);border:1.5px solid var(--tip-line);border-radius:20px;padding:14px 16px;margin-top:10px}
.nles h3{font-size:15px;color:var(--tip-ink)}
.nles ul{margin-top:6px;display:grid;gap:6px}
.nles li{list-style:none;font-size:15px}
.nles li:before{content:"• ";color:var(--tip-ink)}

/* desktop */
.dash{display:grid;gap:16px}
.side{display:none}
@media (min-width:1024px){
  body{font-size:17px}
  .top{padding:16px 28px}
  .nav{display:flex;margin-inline:auto;background:var(--card);border-radius:var(--pill);padding:5px;gap:4px;box-shadow:var(--shadow)}
  .nav a{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--pill);color:var(--ink2);font-size:15px}
  .nav a svg{width:18px;height:18px}
  .nav a.on{background:var(--blue);color:#fff;font-weight:500}
  .tabs{display:none}
  .toptitle{flex:none;max-width:280px}
  main{padding:10px 28px 60px}
  .dash{grid-template-columns:1.25fr 1fr;align-items:start}
  .hero{padding:34px}
  .hero h1{font-size:34px}
  .rows.two{grid-template-columns:1fr 1fr}
  .lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
  .side{display:block;position:sticky;top:90px}
  .side .card{padding:16px}
  .side h3{font-size:14px;color:var(--ink2);margin-bottom:8px}
  .side a{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;font-size:14.5px}
  .side a:hover{background:var(--blue-50)}
  .side a i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
  .side a.h i{background:var(--hard);color:var(--hard-ink)}
  .side a.t i{background:var(--tip);color:var(--tip-ink)}
  .side .lessons{margin-top:12px}
  .side .lessons a.cur{background:var(--blue-50);color:var(--blue);font-weight:500}
  .lesson .summary .jump{display:none}
  .ideas2{display:grid;grid-template-columns:1fr;gap:0}
  h1{font-size:32px}
  .notesgrid{columns:2;column-gap:16px}
  .notesgrid .nchap{break-inside:avoid}
}

/* ── Rewire UI style, blue edition ── */
:root{--bg:#EEF3FA;--r:30px;--line:rgba(22,23,26,.08);--dot:rgba(22,23,26,.13);
  --shadow:0 1px 2px rgba(20,45,90,.04),0 10px 28px -16px rgba(20,45,90,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--line:rgba(255,255,255,.08);--dot:rgba(255,255,255,.12)}}
body{background:radial-gradient(circle,var(--dot) 1px,transparent 1.4px) 0 0/22px 22px,
  radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--blue) 10%,var(--bg)),var(--bg) 70%) fixed;font-size:17px}
h1{font-weight:300;font-size:38px;letter-spacing:-.02em;line-height:1.2}
.hero h1{font-weight:300;font-size:34px}
.sec,h2{font-weight:400}
.card{border:1px solid var(--line);border-radius:var(--r);
  background:linear-gradient(165deg,color-mix(in srgb,var(--blue) 7%,var(--card)) 0%,var(--card) 55%)}
.top{background:transparent;backdrop-filter:blur(12px)}
.row{box-shadow:none;border:0;min-height:82px;background:#E3EEFF}
.row:nth-child(3n+2){background:#DDF1FB}
.row:nth-child(3n+3){background:#E6E8FF}
.row:hover{filter:brightness(.98);background:#D6E7FF}
.row .num{background:var(--card)}
.row .go{background:var(--card)}
.row .txt b{font-weight:400;font-size:19px}
@media (prefers-color-scheme:dark){.row,.row:nth-child(n){background:#1C2A3D}.row:hover{background:#22344C}}
.btn{min-height:60px;font-size:19px;font-weight:500}
.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab .ic{width:60px;height:32px;border-radius:999px}
.tab.on .ic{background:var(--blue);color:#fff}
.tab.on{color:var(--ink)}
.idea .badge{font-weight:500}
.idea h3{font-weight:400;font-size:21px}
.ex{border-radius:22px}
.vis{border-radius:18px;border:1px solid var(--line)}
.tips{border-radius:var(--r)}
.q{border:1px solid var(--line);box-shadow:none;border-radius:999px;padding:10px 12px 10px 18px}
.q .qt{padding-inline-start:6px}
@media (min-width:1024px){h1{font-size:46px}.hero h1{font-size:40px}
  .nav a.on{background:var(--blue)}}

/* ── eye-comfort pass: muted blue, off-white, no dots, no big solid fills ── */
:root{--blue:#4A7FC1;--blue-d:#355F95;--blue-50:#EAF0F7;--blue-100:#DFE8F3;--blue-200:#C3D4EA;--blue-300:#9DB8DC;
  --bg:#F2F3F5;--card:#FAFAFB;--ink:#2E3238;--ink2:#636A73;--ink3:#8E949B;--line:rgba(40,45,55,.08);
  --tip:#FAF4E3;--tip-ink:#6B5520;--tip-line:#EEE2BC;--hl:#F3E6B8;--hard:#F8EDE4;--hard-ink:#9A5A2A;
  --shadow:0 1px 2px rgba(30,40,60,.04),0 8px 22px -16px rgba(30,40,60,.14)}
@media (prefers-color-scheme:dark){:root{--blue:#7FA6D6;--blue-50:#243041;--blue-100:#2A384B;--blue-200:#3A4F6B;--blue-300:#5C7AA3;
  --bg:#1C1E21;--card:#25282C;--ink:#D9DCE0;--ink2:#A3A8AF;--line:rgba(255,255,255,.07);--tip:#2F2B22;--tip-ink:#E2D3A6;--tip-line:#4A4130;--hl:#5A4C26;--hard:#33291F;--hard-ink:#E0A774}}
body{background:var(--bg);color:var(--ink);line-height:1.8}
.card{background:var(--card)}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:500}
.tips mark{background:linear-gradient(transparent 58%,var(--hl) 58%)}
/* hero: pale card, dark text */
.hero{background:var(--blue-50);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.hero h1{color:var(--ink)}
.hero p{opacity:1;color:var(--ink2)}
.hero .stat{background:var(--card);color:var(--ink2)}
.mascot{filter:none;background:var(--card)}
/* rows: one quiet tint, no colour carousel */
.row,.row:nth-child(3n+2),.row:nth-child(3n+3){background:var(--card);border:1px solid var(--line)}
.row:hover{background:var(--blue-50);filter:none}
.row .num{background:var(--blue-50)}
.row .go{background:var(--bg)}
.row[style*="background:var(--blue)"]{background:var(--blue-50)!important;color:var(--ink)!important}
.row[style*="background:var(--blue)"] small{color:var(--ink2)!important}
.row[style*="background:var(--blue)"] .num{background:var(--card)}
/* no solid-blue pills */
.summary .big{background:var(--blue-50);color:var(--blue-d);font-weight:500}
.tab.on .ic{background:var(--blue-50);color:var(--blue-d)}
.nav a.on{background:var(--blue-50)!important;color:var(--blue-d)!important}
.btn.p{background:var(--blue-50);color:var(--blue-d)}
.vctl button.p{background:var(--blue-50);color:var(--blue-d)}
.idea .badge{background:var(--blue-50);color:var(--blue-d)}
.idea.hard .badge{background:var(--hard);color:var(--hard-ink)}
.chead .big{background:var(--blue-50);color:var(--blue-d)}
.cmp i{background:var(--blue-50);color:var(--blue-d)}
.pv .n{background:var(--blue-50);color:var(--blue-d)}
.bar .tot{background:var(--blue-200);color:var(--ink)}
.flow .hl{background:transparent;color:var(--blue-d);font-weight:500;border-bottom:2px solid var(--blue-200);border-radius:0}
.vg .ln,.us .ln{background:var(--ink2)}
.vg > div{font-weight:300}
.ex{background:var(--bg)}
.vis{background:var(--card)}
.vsteps div{background:var(--bg)}
.vsteps div.cur{background:var(--blue-50)}
.wrong .no{background:#F7ECEC;color:#9B3B3B}.wrong .yes{background:#EAF3EC;color:#3C7A4E}
@media (prefers-color-scheme:dark){.wrong .no{background:#3A2A2A;color:#E7A3A3}.wrong .yes{background:#253429;color:#9BD3AC}}
h1{font-weight:300}

body{font-size:19px;line-height:1.85}
main{max-width:1180px}
h1{font-size:40px;line-height:1.25}
.sub{font-size:16px}
.sec{font-size:24px;margin:34px 4px 14px}

/* header */

.idea{margin-top:22px;padding:26px}

.bar .b{height:60px;font-size:18px}
.us{grid-template-columns:40px 100px 100px;font-size:32px}

/* notes page */

.nles li{font-size:18px}

/* ── soft chapter colours ── */
[style*="--c:"]{--cc:var(--c);--cb:color-mix(in srgb,var(--c) 17%,var(--card));--cl:color-mix(in srgb,var(--c) 9%,var(--card))}
@media (prefers-color-scheme:dark){[style*="--c:"]{--cc:color-mix(in srgb,var(--c) 65%,#fff);--cb:color-mix(in srgb,var(--c) 24%,var(--card));--cl:color-mix(in srgb,var(--c) 10%,var(--card))}}
.row[style*="--c:"]{background:var(--cl)!important;border-color:color-mix(in srgb,var(--c) 16%,transparent)}
.row[style*="--c:"]:hover{background:var(--cb)!important}
.row[style*="--c:"] .num{background:var(--cb);color:var(--cc)}
.row[style*="--c:"] .go{background:var(--card);color:var(--cc)}
.row.done[style*="--c:"] .go{background:var(--cc);color:var(--card)}
.chead[style*="--c:"] .big{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .summary .big{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .idea:not(.hard) .badge{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .idea:not(.hard) .ex{background:var(--cl)}
.lesson[style*="--c:"] .idea:not(.hard) .exlab{color:var(--cc)}
.lesson[style*="--c:"] .jump:not(.h):not(.t) i,.lesson[style*="--c:"] .side a:not(.h):not(.t) i{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .lhead .sub{color:var(--cc)}
.lesson[style*="--c:"] .vg .rs,.lesson[style*="--c:"] .vg .an,.lesson[style*="--c:"] .vg .op,.lesson[style*="--c:"] .flow .hl{color:var(--cc)}
.lesson[style*="--c:"] .flow .hl{border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.lesson[style*="--c:"] .vg .col-on,.lesson[style*="--c:"] .vsteps div.cur{background:var(--cb)}
.lesson[style*="--c:"] .vctl button{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .side .lessons a.cur{background:var(--cb);color:var(--cc)}
.lesson[style*="--c:"] .btn.p{background:var(--cb);color:var(--cc)}
.clk svg{width:clamp(74px,22vw,120px)!important;height:auto}
.clk .cap{white-space:nowrap}

/* ── dashboard frame (reference: tablet learning dashboard) ── */
:root{--pri:#1A73E8;--pri-d:#1259BF}
@media (prefers-color-scheme:dark){:root{--pri:#5E9BEB}}
h1,h2,h3,.sec{font-weight:600}
.sb{display:none}
.search{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;height:56px;padding:0 18px;color:var(--ink3);box-shadow:var(--shadow)}
.search svg{width:22px;height:22px;flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);outline:none;min-width:0}
.search input::placeholder{color:var(--ink3)}
.search:focus-within{border-color:var(--pri)}
.sres{position:absolute;top:62px;inset-inline:0;background:var(--card);border-radius:22px;box-shadow:0 18px 40px -12px rgba(20,40,80,.25);border:1px solid var(--line);padding:8px;display:none;z-index:50;max-height:60vh;overflow:auto}
.sres.on{display:block}
.sres a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;color:var(--ink)}
.sres a:hover{background:var(--cl)}
.sres a i{width:40px;height:40px;border-radius:12px;background:var(--cb);color:var(--cc);display:grid;place-items:center;flex:none}
.sres a i svg{width:22px;height:22px}
.sres b{display:block;font-weight:600;font-size:17px}
.sres small{color:var(--ink2);font-size:14px}
.sres .none{padding:14px;color:var(--ink2)}
.top .search{display:none}
.search.m{margin:4px 0 16px}
.tstats{display:none}
.pbar{display:block;height:10px;border-radius:99px;background:var(--blue-50);overflow:hidden;flex:1}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--pri)}

.home{display:grid;gap:22px}
.hero2{position:relative;border-radius:30px;overflow:hidden;min-height:300px;display:flex;align-items:center;
  background:linear-gradient(160deg,#D7E8FF 0%,#E9F3FF 55%,#F3F8FF 100%);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.hero2{background:linear-gradient(160deg,#20324B,#1E2836)}}
.htxt{position:relative;z-index:2;padding:30px;max-width:56%}
.hero2 h1{font-size:38px;line-height:1.3;font-weight:600;color:var(--ink)}
.hero2 h1 em{font-style:normal;color:var(--pri)}
.hero2 p{margin-top:10px;color:var(--ink2);font-size:18px}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:20px;background:var(--pri);color:#fff;height:58px;padding:0 28px;border-radius:999px;font-weight:600;font-size:18px;box-shadow:0 10px 22px -10px rgba(26,115,232,.6)}
.cta svg{width:20px;height:20px}
.heroart{position:absolute;inset-inline-end:0;bottom:0;height:100%;width:52%;z-index:1}
.hbadge{position:absolute;top:16px;inset-inline-end:16px;z-index:3;background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:var(--shadow)}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:182px 230px}
.fl{animation:fl 4s ease-in-out infinite}.fl.f2{animation-delay:-1.3s}.fl.f3{animation-delay:-2.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes fl{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.bob,.fl{animation:none}}
.wave-e{display:inline-block}

.shead{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px -6px}
.shead h2{font-size:24px}
.shead a{color:var(--pri);font-weight:600;font-size:16px}
.cont{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px;box-shadow:var(--shadow)}
.cont:hover{background:var(--cl)}
.thumb{width:150px;height:104px;border-radius:18px;background:linear-gradient(150deg,var(--cb),var(--cl));color:var(--cc);display:grid;place-items:center;position:relative;flex:none}
.thumb svg{width:52px;height:52px}
.thumb b{position:absolute;bottom:8px;inset-inline-start:10px;font-size:14px;background:var(--card);border-radius:99px;padding:1px 10px}
.ctxt{flex:1;min-width:0;display:grid;gap:4px}
.ctxt b{font-size:22px;font-weight:600}
.ctxt small{color:var(--ink2);font-size:15px}
.cprog{display:flex;align-items:center;gap:12px;margin-top:6px}
.cprog .pbar i{background:var(--cc)}
.start{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;border-radius:999px;height:54px;padding:0 24px;font-weight:600;font-size:17px;flex:none}
.start svg{width:16px;height:16px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;background:var(--cl);border:1px solid color-mix(in srgb,var(--c) 14%,transparent);transition:transform .15s,background .15s}
.tile:hover{transform:translateY(-2px);background:var(--cb)}
.ti{width:56px;height:56px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ti svg{width:28px;height:28px}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:19px;font-weight:600;line-height:1.35}
.tt small{color:var(--ink2);font-size:14.5px}
.ta{color:var(--cc);flex:none}.ta svg{width:20px;height:20px}
.tile.done .ta{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}.tile.done .ta svg{width:16px;height:16px}

.hrail{display:grid;gap:16px;align-content:start}
.hrail .card{padding:22px}
.hrail h3{font-size:19px}
.ringw{position:relative;width:170px;height:170px;margin:12px auto 6px}
.ringw svg{width:100%;height:100%}
.ringt{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.ringt b{font-size:30px;font-weight:600}
.ringt small{color:var(--ink2)}
.chdots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.chdots a i{width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--cc);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600}
.chdots a.on i{background:var(--c);border-color:var(--c);color:#fff}
.chdots svg{width:15px;height:15px}
.tipday{display:block;background:var(--tip)!important;border-color:var(--tip-line)!important}
.tdh{display:flex;align-items:center;gap:10px;color:var(--tip-ink)}
.tdh span svg{width:26px;height:26px}
.tipday p{margin-top:10px;font-size:18px;line-height:1.85}
.tipday small{display:block;margin-top:10px;color:var(--tip-ink);font-weight:500}
.notescard{display:flex;align-items:center;gap:14px}
.notescard .nic{width:48px;height:48px;border-radius:14px;background:var(--tip);color:var(--tip-ink);display:grid;place-items:center;flex:none}
.notescard .nic svg{width:24px;height:24px}
.notescard span{flex:1}.notescard b{display:block;font-weight:600}.notescard small{color:var(--ink2);font-size:14.5px}
.notescard > svg{width:20px;height:20px;color:var(--ink3)}

@media (max-width:760px){
  .hero2{flex-direction:column;align-items:stretch;min-height:0}
  .htxt{max-width:none;padding:24px 22px 0}
  .hero2 h1{font-size:29px}
  .heroart{position:relative;width:100%;height:180px;margin-top:-4px}
  .hbadge{display:none}
  .cont{flex-wrap:wrap}
  .thumb{width:92px;height:92px}
  .thumb svg{width:38px;height:38px}
  .ctxt b{font-size:19px}
  .start{width:100%;justify-content:center}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{flex-direction:column;align-items:flex-start;gap:10px;padding:14px}
  .ta{display:none}
  .tt b{font-size:17px}
}

@media (min-width:1024px){
  body{padding-inline-start:280px}
  .sb{display:flex;flex-direction:column;gap:6px;position:fixed;inset-block:14px;inset-inline-start:14px;width:252px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px 14px;box-shadow:var(--shadow);z-index:30;overflow-y:auto;scrollbar-width:none}
  .sbbrand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .sblogo{width:52px;height:52px;flex:none}.sblogo svg{width:100%;height:100%}
  .sbbrand b{display:block;font-size:25px;font-weight:700;line-height:1.1}
  .sbbrand small{color:var(--ink2);font-size:13px}
  .sbnav{display:grid;gap:4px}
  .sbnav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--ink2);font-size:17px;font-weight:500}
  .sbnav a svg{width:22px;height:22px}
  .sbnav a:hover{background:var(--bg)}
  .sbnav a.on{background:var(--blue-50);color:var(--pri)}
  .sbh{font-size:13px;color:var(--ink3);margin:14px 14px 4px;font-weight:500}
  .sbch{display:grid;gap:2px}
  .sbch a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;font-size:15.5px;color:var(--ink)}
  .sbch a:hover,.sbch a.on{background:var(--cl)}
  .sbch a.on{color:var(--cc);font-weight:600}
  .sbch i{width:30px;height:30px;border-radius:10px;background:var(--cb);color:var(--cc);display:grid;place-items:center;flex:none}
  .sbch i svg{width:17px;height:17px}
  .sbcard{margin-top:auto;background:var(--blue-50);border-radius:20px;padding:14px}
  .sbh2{font-weight:600;font-size:15px;margin-bottom:8px}
  .sbcard small{display:block;margin-top:8px;color:var(--ink2);font-size:14px}
  .top{padding:16px 28px;gap:16px}
  .top .brand{display:none}
  .top .search{display:flex;flex:1;max-width:520px}
  .search.m{display:none}
  .nav{display:none!important}
  .tstats{display:flex;gap:10px;margin-inline-start:auto}
  .tstat{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
  .tstat svg{width:18px;height:18px;color:var(--pri)}
  .tstat.s2 svg{color:#D39A12}
  .tstat b{font-size:17px}.tstat small{color:var(--ink2)}
  main{max-width:1320px;padding-top:4px}
  .home{grid-template-columns:minmax(0,1fr) 320px;align-items:start}
  .hero2{min-height:330px}
  .hero2 h1{font-size:44px}
  .hrail{position:sticky;top:96px}
  .lesson{grid-template-columns:minmax(0,860px) 300px}
}
@media (min-width:1024px) and (max-width:1280px){.home{grid-template-columns:1fr}.hrail{position:static;grid-template-columns:1fr 1fr}.hrail .notescard{grid-column:1/-1}}

/* generated hero banner */
.hero2{background:#CFE6F7}
.heroimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left center;z-index:0}
.hero2 .htxt{margin-inline-start:0;max-width:50%}
.hero2::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to left,rgba(234,244,252,.75) 0%,rgba(234,244,252,.35) 40%,transparent 60%)}
@media (prefers-color-scheme:dark){.hero2::after{background:linear-gradient(to left,rgba(20,30,45,.85),rgba(20,30,45,.4) 45%,transparent 65%)}.hero2 h1,.hero2 p{color:#F0F3F7}}
@media (min-width:1024px){.hero2{min-height:380px}}
@media (max-width:760px){
  .hero2{display:flex;flex-direction:column-reverse;min-height:0}
  .heroimg{display:block;position:relative;height:230px}
  .heroimg img{object-position:50% 60%}
  .hero2::after{display:none}
  .hero2 .htxt{max-width:none;padding:20px 22px 24px;background:var(--card)}
  .hero2 h1{font-size:28px}
}

/* ── notes box: prominent ── */
.tips{background:#FFF1BD;border:0;border-radius:32px;padding:26px;box-shadow:0 14px 30px -18px rgba(180,130,0,.45);position:relative;overflow:hidden}
.tips:before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:10px;background:#F6B73C}
.tiph{display:flex;align-items:center;gap:14px}
.tipic{width:58px;height:58px;border-radius:18px;background:#F6B73C;color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px rgba(200,140,0,.6)}
.tipic svg{width:32px;height:32px}
.tips h2{font-size:28px;color:#5A3E00;font-weight:700}
.tiph p{color:#7A5A12;font-size:17px;margin-top:2px}
.tipl{list-style:none;display:grid;gap:12px;margin-top:18px}
.tipl li{display:flex;gap:14px;align-items:flex-start;background:#FFFBEA;border-radius:20px;padding:14px 16px;font-size:20px;line-height:1.85;color:#3A2E12}
.tipl li:before{display:none}
.tipl li i{font-style:normal;flex:none;width:34px;height:34px;border-radius:50%;background:#F6B73C;color:#fff;display:grid;place-items:center;font-weight:700;font-family:"Hanken Grotesk";font-size:17px;margin-top:3px}
.tips mark{background:#FFD54A;border-radius:6px;padding:1px 6px;font-weight:600;color:#3A2A00}
.tips .words div{background:#FFFBEA}
@media (prefers-color-scheme:dark){
  .tips{background:#3A3018;box-shadow:none}.tips h2{color:#FFE29A}.tiph p{color:#E8CF8E}
  .tipl li{background:#2C2614;color:#F1E6C8}.tips mark{background:#8A6A12;color:#FFF4D6}.tips .words div{background:#2C2614}}
@media (max-width:640px){.tips{padding:20px 16px}.tips h2{font-size:23px}.tipl li{font-size:18px;padding:12px}}

/* ── no red anywhere ── */
:root{--bad:#B9954A}
.wrong .no{background:#F3EFE6!important;color:#7A6640!important}
.wrong .yes{background:#E8F3EC!important;color:#2F6E45!important}
@media (prefers-color-scheme:dark){.wrong .no{background:#33302A!important;color:#D9C9A3!important}}
</style>

/* ───────── visuals ───────── */
const COLN = ['Ones','Tens','Hundreds','Thousands'];
const COLA = ['الآحاد','العشرات','المئات','الألوف'];
let VID = 0;
function vcalc(s){
  const a=+s.a, b=+s.b, add = s.op==='+';
  const res = add ? a+b : a-b;
  const da=[...String(a)].reverse().map(Number), db=[...String(b)].reverse().map(Number);
  const m=Math.max(da.length,db.length);
  const steps=[], ann=[]; // ann: {col,val,step}
  const rd=[]; let c=0;
  if(add){
    for(let i=0;i<m;i++){
      const x=da[i]||0, y=db[i]||0, sum=x+y+c, cin=c;
      const parts = [x, ...(i<db.length?[y]:[]), ...(cin?['1']:[])];
      let t = `${COLA[i]}: <span class="ltr">${(i<da.length?[x]:[]).concat(i<db.length?[y]:[]).join(' + ')}${cin?' + 1':''} = ${sum}</span>`;
      if(cin) t += ' (ومعاها الشايل)';
      if(sum>=10){ t += ` ← نكتب <b class="ltr">${sum%10}</b> ونشيل <b>1</b> فوق ${COLA[i+1]}`; rd[i]=sum%10; c=1; ann.push({col:i+1,val:'1',step:steps.length}); }
      else { t += ` ← نكتب <b class="ltr">${sum}</b>`; rd[i]=sum; c=0; }
      steps.push({col:i,t});
    }
    if(c){ rd[m]=1; steps.push({col:m,t:`${COLA[m]}: الشايل <b>1</b> ينزل لوحده ← نكتب <b>1</b>`}); }
  } else {
    const top=da.slice();
    for(let i=0;i<m;i++){
      const y=db[i]||0; let t='';
      if(top[i]<y){
        let j=i+1; while(top[j]===0) j++;
        const st=steps.length;
        if(j===i+1){
          top[j]-=1; ann.push({col:j,val:String(top[j]),step:st});
          t=`${COLA[i]}: <span class="ltr">${top[i]}</span> أصغر من <span class="ltr">${y}</span> ← نستلف <b>1</b> من ${COLA[j]} (تبقى <span class="ltr">${top[j]}</span>) و ${COLA[i]} تبقى <span class="ltr">${top[i]+10}</span>. `;
        } else {
          top[j]-=1; ann.push({col:j,val:String(top[j]),step:st});
          for(let k=j-1;k>i;k--){ top[k]=9; ann.push({col:k,val:'9',step:st}); }
          t=`${COLA[i]}: <span class="ltr">${top[i]}</span> أصغر من <span class="ltr">${y}</span> والجار صفر ← نستلف من ${COLA[j]}: تبقى <span class="ltr">${top[j]}</span>، وال${COLA[i+1].slice(2)} تبقى 9، و ${COLA[i]} تبقى <span class="ltr">${top[i]+10}</span>. `;
        }
        top[i]+=10; ann.push({col:i,val:String(top[i]),step:st});
        t+=`<span class="ltr">${top[i]} − ${y} = ${top[i]-y}</span>`;
      } else {
        t=`${COLA[i]}: ` + (i<db.length ? `<span class="ltr">${top[i]} − ${y} = ${top[i]-y}</span>` : `مفيش حاجة نطرحها ← ننزّل <span class="ltr">${top[i]}</span> زي ما هي`);
      }
      rd[i]=top[i]-y;
      const lead = i===m-1 && rd[i]===0 && m>1 && String(res).length<m;
      if(lead) t+=' ← <b>ما نكتبش الصفر</b> على الشمال';
      steps.push({col:i,t});
    }
  }
  const resStr=String(res), n=Math.max(m,resStr.length);
  const rdig=[...resStr].reverse();
  const id='v'+(++VID);
  const cols=n+1; // op col
  const cell=(cls,txt,col)=>`<div class="${cls}" ${col!=null?`data-c="${col}"`:''}>${txt}</div>`;
  let g='';
  // header
  g+=cell('hd','');
  for(let i=n-1;i>=0;i--) g+=cell('hd',COLN[i],i);
  // annotations
  g+=cell('an','');
  for(let i=n-1;i>=0;i--) g+=cell('an hide','',i);
  // top
  g+=cell('','');
  for(let i=n-1;i>=0;i--) g+=cell('tp',i<da.length?da[i]:'',i);
  // bottom
  g+=cell('op',add?'+':'−');
  for(let i=n-1;i>=0;i--) g+=cell('bt',i<db.length?db[i]:'',i);
  g+=`<div class="ln" style="grid-column:1/${cols+1}"></div>`;
  g+=cell('','');
  for(let i=n-1;i>=0;i--) g+=cell('rs hide',i<rdig.length?rdig[i]:'',i);
  const html=`<div class="vis vcalc" id="${id}">
    <div class="vg" style="grid-template-columns:repeat(${cols},auto)">${g}</div>
    <div class="vctl"><button class="p" data-a="step">${IC.play.replace('<svg','<svg width="14" height="14"')} خطوة بخطوة</button><button data-a="all">الحل كله</button></div>
    <div class="vsteps">${steps.map(s=>`<div>${s.t}</div>`).join('')}</div>
  </div>`;
  VSTATE[id]={steps,ann,n,step:steps.length,res:rdig,sub:!add};
  return html;
}
const VSTATE={};
function vpaint(id){
  const S=VSTATE[id], root=document.getElementById(id); if(!root) return;
  const k=S.step; // number of completed steps
  root.querySelectorAll('.vg [data-c]').forEach(el=>el.classList.remove('col-on'));
  root.querySelectorAll('.rs').forEach(el=>{
    const c=+el.dataset.c; const doneCols=S.steps.slice(0,k).map(s=>s.col);
    const lastStepCol = S.steps.length? S.steps[S.steps.length-1].col : 0;
    let show = doneCols.includes(c) || (k===S.steps.length && c<S.res.length);
    el.classList.toggle('hide',!show);
  });
  // annotations: last one per col whose step < k
  const per={};
  S.ann.forEach(a=>{ if(a.step<k) per[a.col]=a.val; });
  root.querySelectorAll('.an[data-c]').forEach(el=>{
    const c=+el.dataset.c; el.textContent=per[c]||''; el.classList.toggle('hide',!per[c]);
  });
  root.querySelectorAll('.tp').forEach(el=>{ const c=+el.dataset.c; el.classList.toggle('x', S.sub && !!per[c]); });
  const cur = k>0 && k<=S.steps.length ? S.steps[k-1].col : null;
  if(k<S.steps.length && cur!=null) root.querySelectorAll(`.vg [data-c="${cur}"]`).forEach(el=>el.classList.add('col-on'));
  root.querySelectorAll('.vsteps div').forEach((el,i)=>{ el.classList.toggle('on',i<k); el.classList.toggle('cur',i===k-1 && k<S.steps.length); });
  const b=root.querySelector('[data-a="step"]');
  b.innerHTML = (k>=S.steps.length?'↺ من الأول':(k===0?IC.play.replace('<svg','<svg width="14" height="14"')+' ابدأ':'الخطوة اللي بعدها ←'));
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.vctl button'); if(!b) return;
  const root=b.closest('.vcalc'), S=VSTATE[root.id];
  if(b.dataset.a==='all'){ S.step=S.steps.length; }
  else { if(S.step>=S.steps.length) S.step=0; else S.step++; }
  vpaint(root.id);
});

function flow(lines){
  const out=[];
  lines.forEach((l,i)=>{
    if(i) out.push('<span class="arr">↓</span>');
    const h=esc(l).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>');
    out.push(AR.test(l)?`<div class="ar">${h}</div>`:`<div>${h}</div>`);
  });
  return `<div class="vis flow">${out.join('')}</div>`;
}

}

function nline(s){
  const W=360,P=22,x=v=>P+(v-s.from)/(s.to-s.from)*(W-2*P); let g='';
  g+=`<line x1="${P-8}" x2="${W-P+8}" y1="60" y2="60" stroke="var(--ink)" stroke-width="2"/>`;
  for(let v=s.from;v<=s.to;v+=s.minor){ const big=s.labels.includes(v); g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${big?50:54}" y2="${big?70:66}" stroke="var(--ink)" stroke-width="${big?2:1.2}"/>`; }
  s.labels.forEach(v=>{ g+=`<rect x="${x(v)-20}" y="14" width="40" height="24" rx="7" fill="var(--blue)"/><text x="${x(v)}" y="31" text-anchor="middle" fill="#fff" font-size="13" font-weight="600" font-family="Hanken Grotesk">${v}</text>`; });

  });
  return `<div class="vis"><svg viewBox="0 0 ${W} 124" width="${W}">${g}</svg></div>`;
}
function ruler(s){
  const mm=s.cm*10, W=Math.min(360, 40+mm*(s.zoom?9:3.2)), P=16, u=(W-2*P)/mm, x=v=>P+v*u; let g='';

  g+=`<rect x="2" y="${top}" width="${W-4}" height="${s.zoom?56:46}" rx="8" fill="#FFF5CC" stroke="#E6C863"/>`;
  for(let v=0;v<=mm;v++){ const c=v%10===0, h=v%5===0; g+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="${top+(c?18:h?12:7)}" stroke="#5B4300" stroke-width="${c?1.6:.9}"/>`; if(c) g+=`<text x="${x(v)}" y="${top+(s.zoom?36:32)}" text-anchor="middle" font-size="11" fill="#5B4300" font-family="Hanken Grotesk">${v/10}</text>`; }

function clock(h,m,cap){
  const cx=55,cy=55,r=46; let g=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--card)" stroke="var(--blue)" stroke-width="3"/>`;
  for(let i=1;i<=12;i++){ const a=i*Math.PI/6; g+=`<text x="${cx+Math.sin(a)*36}" y="${cy-Math.cos(a)*36+4}" text-anchor="middle" font-size="11" fill="var(--ink2)" font-family="Hanken Grotesk">${i}</text>`; }
  for(let i=0;i<60;i++){ if(i%5) { const a=i*Math.PI/30; g+=`<circle cx="${cx+Math.sin(a)*42}" cy="${cy-Math.cos(a)*42}" r=".9" fill="var(--ink3)"/>`; } }
  const ha=((h%12)+m/60)*Math.PI/6, ma=m*Math.PI/30;
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(ha)*22}" y2="${cy-Math.cos(ha)*22}" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.sin(ma)*34}" y2="${cy-Math.cos(ma)*34}" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--blue)"/>`;
  return `<div class="clk"><svg viewBox="0 0 110 110" width="110">${g}</svg>${cap?`<div class="cap">${esc(cap)}</div>`:''}</div>`;
}

function vis(e){
  switch(e.k){
    case 'v': return vcalc(e);
    case 'flow': return flow(e.lines);
    case 'table': return table(e.rows);
    case 'pict': return pict(e);
    case 'pict2': return pict({...e.a,show:e.show},e.a.title)+pict({...e.b,show:e.show},e.b.title);
    case 'blocks': return blocks(e);
    case 'nline': return nline(e);
    case 'ruler': return ruler(e);
    case 'clocks': return clocks(e);
    case 'daybar': return daybar();
    case 'jugs': return jugs(e);
    case 'wrong': return wrong(e);
    case 'conv': return conv(e);
    case 'cmp': return cmp(e);
    case 'bar': return bar(e);
    case 'unitsum': return unitsum(e);
    case 'pv': return pv(e);
    case 'pvop': return pvop(e);
    case 'split': return split(e);
  }
  return '';
}

  $('#tabs').innerHTML = items.map(([k,h,t,i])=>`<a class="tab ${k===tab?'on':''}" href="${h}"><span class="ic">${i}</span>${t}</a>`).join('');

function searchBox(cls){ return `<div class="search ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" placeholder="دوّري على درس أو فكرة…" autocomplete="off"><div class="sres"></div></div>`; }
function doSearch(inp){
  const q=inp.value.trim().toLowerCase(), box=inp.parentElement.querySelector('.sres');
  if(q.length<2){ box.innerHTML=''; box.classList.remove('on'); return; }
  const hits=[];
  allLessons.forEach(l=>{ const hay=[l.ar,l.en,l.ch.ar,l.ch.en,...l.ideas.map(i=>i.t+' '+i.d),...l.tricky.map(i=>i.t+' '+i.d),...l.tips].join(' ').toLowerCase().replace(/==/g,''); if(hay.includes(q)) hits.push(l); });
  box.innerHTML = hits.length ? hits.slice(0,8).map(l=>`<a href="#l-${l.id}"${cst(l.ch.id)}><i>${IC[l.ch.icon]}</i><span><b>${esc(l.ar)}</b><small>${esc(l.ch.ar)} · <span class="ltr">${esc(l.en)}</span></small></span></a>`).join('') : `<div class="none">مفيش نتايج… جربي كلمة تانية</div>`;
  box.classList.add('on');
}

function bookView(){
  return `<div class="lhead"><h1>كل الدروس</h1><p class="sub">Primary 2 · First Term · Performance Tasks and Assessments</p></div>
  <div class="rows two" style="margin-top:14px">${BOOK.map(chapterRow).join('')}</div>`;
}
function lessonRow(l){
  const d=DONE.has(l.id);
  return `<a class="row ${d?'done':''}"${cst(l.ch.id)} href="#l-${l.id}"><span class="num t">${l.n}</span><span class="txt"><b>${l.ar}</b><small class="ltr" style="text-align:right">${esc(l.en)}</small><small>${l.ideas.length} أفكار${l.tricky.length?` + ${l.tricky.length} صعبة`:''} · صفحة ${l.page}</small></span><span class="go">${d?IC.check:IC.go}</span></a>`;
}
function chapter(c){
  return `<div class="chead"${cst(c.id)}><span class="big">${IC[c.icon]}</span><div><div class="sub ltr" style="text-align:right">Chapter ${c.id} · ${c.en}</div><h1>${c.ar}</h1><p class="sub">${c.lessons.length} دروس · اضغطي على الدرس تشوفي أفكاره</p></div></div>
  <div class="rows two" style="margin-top:16px">${c.lessons.map(lessonRow).join('')}</div>`;
}
function ideaHTML(it,i,hard){
  return `<article class="card idea ${hard?'hard':''}" id="${hard?'h':'i'}${i+1}">
    <div class="ih"><span class="badge">${hard?'!':i+1}</span><div>${hard?'<div class="lab">فكرة صعبة شوية</div>':''}<h3>${mk(it.t)}</h3></div></div>
    <p class="d">${mk(it.d)}</p>
    ${it.ex.length?`<div class="ex"><div class="exlab">مثال محلول</div>${it.ex.map(vis).join('')}</div>`:''}
    ${it.steps.length?`<ol class="steps">${it.steps.map(s=>`<li><span>${mk(s)}</span></li>`).join('')}</ol>`:''}
  </article>`;
}
function lesson(l){
  const c=l.ch, idx=allLessons.indexOf(l), nx=allLessons[idx+1];
  const jumps = l.ideas.map((it,i)=>`<a class="jump" href="javascript:void(0)" data-j="i${i+1}"><i>${i+1}</i>${mk(it.t)}</a>`).join('')
    + l.tricky.map((it,i)=>`<a class="jump h" href="javascript:void(0)" data-j="h${i+1}"><i>!</i>${mk(it.t)}</a>`).join('')
    + `<a class="jump t" href="javascript:void(0)" data-j="tips"><i>★</i>ملاحظات ماما</a>`;
  const sideIdeas = l.ideas.map((it,i)=>`<a href="javascript:void(0)" data-j="i${i+1}"><i>${i+1}</i>${mk(it.t)}</a>`).join('')
    + l.tricky.map((it,i)=>`<a class="h" href="javascript:void(0)" data-j="h${i+1}"><i>!</i>${mk(it.t)}</a>`).join('')
    + `<a class="t" href="javascript:void(0)" data-j="tips"><i>★</i>ملاحظات ماما</a>` + (l.practice?.length?`<a href="javascript:void(0)" data-j="prac"><i>✎</i>تمارين من الكتاب</a>`:'');
  const d=DONE.has(l.id);
  return `<div class="lesson"${cst(c.id)}><div>
    <div class="lhead"><div class="sub">الفصل ${c.id} · ${c.ar} · الدرس ${l.n}</div><h1>${l.ar}</h1><div class="en ltr" style="text-align:right">${esc(l.en)}</div></div>
    <div class="summary"><span class="big">الدرس فيه ${l.ideas.length} ${l.ideas.length>2?'أفكار':'فكرة'}${l.tricky.length?` + ${l.tricky.length} صعبة`:''}</span><span class="chip">صفحة ${l.page} في الكتاب</span>${jumps}</div>
    ${l.ideas.map((it,i)=>ideaHTML(it,i,false)).join('')}
    ${l.tricky.length?`<div class="hardhead"><span class="tag">أفكار صعبة شوية</span><span class="sub">مش بتيجي كتير، بس بتيجي في الامتحان</span></div>${l.tricky.map((it,i)=>ideaHTML(it,i,true)).join('')}`:''}
    <section class="tips" id="tips"><div class="tiph"><span class="tipic">${IC.bulb}</span><div><h2>ملاحظات مهمة لماما</h2><p>حيل سريعة تقوليها وهو بيحل… من غير أي تحضير</p></div></div><ol class="tipl">${l.tips.map((t,i)=>`<li><i>${i+1}</i><span>${mk(t)}</span></li>`).join('')}</ol>
      ${l.words?`<div class="words">${l.words.map(([e,a])=>`<div><span class="ltr">${esc(e)}</span><span>${esc(a)}</span></div>`).join('')}</div>`:''}
    </section>
    ${l.practice?.length?`<section class="prac" id="prac"><h2>تمارين من الكتاب</h2><p class="sub">اسأليه، وبعدين اضغطي تشوفي الإجابة.</p>${l.practice.map(([q,a])=>`<div class="q"><div class="qt"><div${sdir(q)}>${esc(q)}</div><div class="ans ltr">${esc(a)}</div></div><button>الإجابة</button></div>`).join('')}</section>`:''}
    <div class="foot"><button class="btn s ${d?'on':''}" id="doneBtn">${IC.check} ${d?'خلصنا الدرس':'علّمي إنكم خلصتوه'}</button>${nx?`<a class="btn p" href="#l-${nx.id}">الدرس اللي بعده ${IC.go}</a>`:`<a class="btn p" href="#home">الرئيسية</a>`}</div>
  </div>
  <aside class="side"><div class="card"><h3>في الدرس ده</h3>${sideIdeas}
    <div class="lessons"><h3 style="margin-top:14px">دروس الفصل</h3>${c.lessons.map(x=>`<a class="${x===l?'cur':''}" href="#l-${x.id}"><i>${DONE.has(x.id)?'✓':x.n}</i>${mk(x.ar)}</a>`).join('')}</div></div></aside>
  </div>`;
}
function notes(){
  return `<div class="lhead"><h1>ملاحظات ماما</h1><p class="sub">كل الحيل والملاحظات المهمة من كل الدروس في مكان واحد — للمراجعة قبل الامتحان.</p></div>
  <div class="notesgrid">${BOOK.map(c=>`<div class="nchap"><h2>${c.id}. ${c.ar}</h2>${c.lessons.map(l=>`<a href="#l-${l.id}" style="display:block" class="nles"><h3>${esc(l.ar)} ←</h3><ul>${l.tips.map(t=>`<li>${mk(t)}</li>`).join('')}</ul></a>`).join('')}</div>`).join('')}</div>`;
}

function routeParts(){
  let r=decodeURIComponent(location.hash.slice(1));
  if(r.startsWith('/')){ const p=r.replace(/^\/+/,'').split('/'); return p[0]?p:['home']; }
  let m;
  if((m=r.match(/^l-(\d+-\d+)$/))) return ['l',m[1]];
  if((m=r.match(/^c-(\d+)$/))) return ['c',m[1]];
  if((m=r.match(/^notes-(\d+)$/))) return ['notes',m[1]];
  if(r==='notes'||r==='book') return [r];
  return ['home'];
}
/* ───────── router ───────── */
function render(){
  const h=routeParts();
  for(const k in VSTATE) delete VSTATE[k];
  VID=0;
  let route={view:'home'}, html='';
  if(h[0]==='c'){ const c=BOOK.find(x=>x.id==h[1]); route={view:'chapter',back:'#book',title:c.ar,ch:c.id}; html=chapter(c); }
  else if(h[0]==='l'){ const l=allLessons.find(x=>x.id===h[1]); route={view:'lesson',back:'#c-'+l.ch.id,title:l.ar,ch:l.ch.id}; html=lesson(l); }
  else if(h[0]==='book'){ route={view:'book'}; html=bookView(); }
  else if(h[0]==='notes'){ route={view:'notes'}; html=notes(); }
  else html=home();
  shell(route);
  $('#app').innerHTML=html;
  Object.keys(VSTATE).forEach(vpaint);
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-j]'); if(j){ e.preventDefault(); document.getElementById(j.dataset.j)?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const q=e.target.closest('.q button'); if(q){ q.closest('.q').classList.add('open'); return; }
  if(e.target.closest('#doneBtn')){
    const id=routeParts()[1]; DONE.has(id)?DONE.delete(id):DONE.add(id); saveDone();
    const y=scrollY; render(); scrollTo(0,y);
  }
});
addEventListener('hashchange',render);
render();
</script>
<script>/* kid.js */
/* Shattour — kid layer: sounds, confetti pop, picture stories, emoji charts, and the "Play with Shattour" game.
   Loaded after the main app script; it wraps a few of its functions. */

/* ───────── sound (Web Audio, no files) ───────── */
let SOUND = localStorage.getItem('mm-sound') !== 'off';
let AC = null;
const ac = () => (AC ||= new (window.AudioContext || window.webkitAudioContext)());
function tone(f0, f1, dur, type = 'sine', vol = .22, delay = 0) {
  if (!SOUND) return;
  const c = ac(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 30), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur = .08, vol = .18, delay = 0, hp = 900) {
  if (!SOUND) return;
  const c = ac(), t = c.currentTime + delay, b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol; s.buffer = b;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const SFX = {
  pop()   { tone(900, 140, .13, 'sine', .3); noise(.05, .12); },
  tick()  { tone(1300, 900, .05, 'triangle', .12); },
  ding()  { tone(880, 880, .18, 'triangle', .2); tone(1320, 1320, .3, 'triangle', .18, .1); },
  boing() { tone(330, 140, .35, 'sine', .22); tone(345, 150, .35, 'sine', .1, .02); },
  boom()  { noise(.35, .32, 0, 200); tone(220, 60, .35, 'sine', .3); [0, .07, .14, .21].forEach((d, i) => tone(700 + i * 150, 300, .1, 'sine', .14, .1 + d)); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .22, 'triangle', .2, i * .12)); tone(1047, 1047, .6, 'sine', .14, .5); },
};

/* ───────── confetti + "بوب!" ───────── */
function burst(x, y, big) {
  const n = big ? 46 : 24, wrap = document.createElement('div');
  wrap.className = 'burst'; wrap.style.left = x + 'px'; wrap.style.top = y + 'px';
  const bits = ['star', 'balloon', 'gem', 'star', 'medal', 'donut'];
  const cols = ['#4A7FC1', '#F6B73C', '#7FC4E8', '#56B47C', '#9C83E0', '#2A93B5'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'), a = Math.random() * Math.PI * 2, r = (big ? 140 : 90) + Math.random() * (big ? 160 : 80);
    s.style.setProperty('--dx', Math.cos(a) * r + 'px'); s.style.setProperty('--dy', Math.sin(a) * r - 40 + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    if (i % 3 === 0) s.innerHTML = S(bits[i % bits.length], 26);
    else { s.className = 'dot'; s.style.background = cols[i % cols.length]; }
    s.style.animationDelay = (Math.random() * .08) + 's';
    wrap.appendChild(s);
  }
  const w = document.createElement('b'); w.className = 'popword'; w.textContent = big ? 'برافو!' : 'بوب!'; wrap.appendChild(w);
  document.body.appendChild(wrap); setTimeout(() => wrap.remove(), 1300);
}
const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

/* ───────── pictures ───────── */
const EMO = { Car: 'car', Motorcycle: 'moto', Train: 'train', Airplane: 'plane', Red: 'dot_Red', Blue: 'dot_Blue', Yellow: 'dot_Yellow', Green: 'dot_Green', Purple: 'dot_Purple',
  Strawberry: 'strawberry', Orange: 'orange', Apple: 'apple', Banana: 'banana', Grape: 'grape', Tomato: 'tomato', Corn: 'corn', Potato: 'potato', pencil: 'pencil', Pencil: 'pencil',
  Zoo: 'lion', Pyramid: 'pyramid', Museum: 'museum', 'The bear': 'bear', Ball: 'ball', Robot: 'robot', 'The car': 'car' };
const FOOD = ['apple', 'orange', 'strawberry', 'cookie', 'cupcake', 'banana', 'ball', 'car', 'balloon', 'donut'];
const pickEm = n => FOOD[Math.abs(n * 7 + 3) % FOOD.length];

function tenBox(em) { return `<span class="tbox" title="علبة فيها 10">${Array(10).fill(`<i>${S(em, 13)}</i>`).join('')}</span>`; }
function heap(n, em, opt = {}) {
  const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  let out = '';
  for (let i = 0; i < h; i++) out += `<span class="crate"><b>100</b><small>${S(em, 18)}</small></span>`;
  for (let i = 0; i < t; i++) out += tenBox(em);
  for (let i = 0; i < o; i++) out += `<span class="one ${opt.eaten && i >= o - opt.eaten ? 'eaten' : ''}">${S(em, 30)}</span>`;
  return `<span class="heap">${out || '<span class="zero">0</span>'}</span>`;
}
function story(e) {
  const a = +e.a, b = +e.b, add = e.op === '+', r = add ? a + b : a - b;
  if (a > 199 || b > 199 || r > 199) return '';
  const em = pickEm(a + b);
  const carry = add && (a % 10 + b % 10) >= 10, borrow = !add && (a % 10) < (b % 10);
  const note = carry ? `${S('gift', 24)} الآحاد بقوا ${a % 10 + b % 10}… كل 10 <b>نقفلهم في علبة</b> — ده هو الشايل!`
    : borrow ? `${S('gift', 24)} الحبات السايبة مش مكفية… <b>نفتح علبة</b> ونطلّع منها 10 — ده هو الاستلاف!` : '';
  return `<div class="story" dir="rtl">
    <div class="sp"><small>${add ? 'عندنا' : 'كان عندنا'}</small>${heap(a, em)}<b class="ltr">${a}</b></div>
    <div class="sop">${add ? '+' : '−'}</div>
    <div class="sp"><small>${add ? 'وجالنا كمان' : 'أكلنا / أخدنا'}</small>${heap(b, em)}<b class="ltr">${b}</b></div>
    <div class="sop">=</div>
    <div class="sp win"><small>${add ? 'بقى عندنا' : 'فضل معانا'}</small>${heap(r, em)}<b class="ltr">${r}</b></div>
    ${note ? `<p class="snote">${note}</p>` : ''}
  </div>`;
}

/* wrap the main renderers */
const _vis = vis;
vis = function (e) {
  if (e.k === 'v') return `<div class="vwrap">${story(e)}${_vis(e)}</div>`;
  return _vis(e);
};
const _pict = pict;
pict = function (s, title) {
  if (!s.cols.every(c => EMO[c[0]])) return _pict(s, title);
  return `<div class="vis epict">${title ? `<div class="ept">${esc(title)}</div>` : ''}<div class="ecols">${s.cols.map(([lab, n], i) => {
    const hl = !s.hl || s.hl.includes(i);
    return `<div class="ecol ${hl ? '' : 'dim'}"><div class="estack">${Array(n).fill(S(EMO[lab], 28)).join('')}</div><small class="ltr">${esc(lab)}</small>${s.show ? `<b>${n}</b>` : ''}</div>`;
  }).join('')}</div></div>`;
};
const _lesson = lesson;
lesson = function (l) {
  return _lesson(l)
    .replace('<section class="tips"', gameCard(l) + '<section class="tips"')
    .replace('<span class="chip">صفحة', `<button class="playchip" data-play="${l.id}">${S('balloon', 22)} العب مع شطّور</button><span class="chip">صفحة`);
};
function gameCard(l) {
  return `<section class="gamecard" ${cst(l.ch.id)}>
    <div class="gtxt"><h2>${S('balloon', 34)} يلا نلعب مع شطّور!</h2><p>5 أسئلة بالصور على الدرس ده. كل إجابة صح من أول مرة = <b>10 نقط</b> وصوت بوب!</p>
    <button class="cta" data-play="${l.id}">ابدأ اللعب ▶</button></div>
    <div class="gmas">${IC.mascot}</div>
  </section>`;
}

/* ───────── the game ───────── */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function opts(ans, spread = [1, 2, 10]) {
  const s = new Set([ans]); let k = 0;
  while (s.size < 3 && k++ < 40) { const d = spread[rnd(0, spread.length - 1)] * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) s.add(ans + d); }
  return shuffle([...s]);
}
const fmtT = (h, m) => `${h}:${String(m).padStart(2, '0')}`;
function clockSvg(h, m) { return clock(h, m, '').replace('width="110"', 'width="170"'); }

function makeQ(l) {
  const ch = l.ch.id, n = l.n;
  const em = FOOD[rnd(0, 5)], ie = (n, z = 34) => S(n, z, 'inl');
  switch (ch) {
    case 1: {
      const kinds = shuffle(['apple', 'banana', 'strawberry', 'car', 'ball', 'orange']).slice(0, 3), counts = kinds.map(() => rnd(2, 6));
      if (n === 1 || Math.random() < .5) {
        const k = rnd(0, 2), items = shuffle(kinds.flatMap((x, i) => Array(counts[i]).fill(x)));
        return { q: `كام ${ie(kinds[k])} في الصورة؟`, pic: `<div class="scatter">${items.map(x => S(x, 42)).join('')}</div>`, ans: counts[k], opts: opts(counts[k], [1, 2]) };
      }
      const mx = Math.max(...counts); if (counts.filter(c => c === mx).length > 1) counts[0] = mx + 1;
      const big = kinds[counts.indexOf(Math.max(...counts))];
      return { q: 'مين الأكتر؟ (العمود الأطول)', pic: `<div class="ecols">${kinds.map((x, i) => `<div class="ecol"><div class="estack">${Array(counts[i]).fill(S(x, 38)).join('')}</div><small class="cname">${NAMES[x]?.[0] || ''}</small></div>`).join('')}</div>`, ans: big, opts: shuffle([...kinds]) };
    }
    case 2: {
      const carry = n >= 3; let a, b;
      do { a = rnd(n === 2 ? 1 : 11, 39); b = rnd(n === 2 ? 1 : 5, 29); } while (((a % 10 + b % 10) >= 10) !== carry || a + b > 70);
      return { q: `عندنا ${a} ${ie(em)} وجالنا ${b} كمان… بقوا كام؟`, pic: `<div class="qrow">${heap(a, em)}<i>+</i>${heap(b, em)}</div>`, ans: a + b, opts: opts(a + b) };
    }
    case 3: {
      const borrow = n >= 3; let a, b;
      do { a = rnd(12, 45); b = rnd(2, a - 3); } while (((a % 10) < (b % 10)) !== borrow);
      return { q: `كان معانا ${a} ${ie(em)} وأخدنا ${b}… فضل كام؟`, pic: `<div class="qrow">${heap(a, em)}<i>−</i><span class="eatme">${b}</span></div>`, ans: a - b, opts: opts(a - b) };
    }
    case 4: {
      if (n === 2 && Math.random() < .5) {
        const acts = [['بنروح المدرسة', 'AM'], ['بننام', 'PM'], ['الفطار', 'AM'], ['العشا', 'PM'], ['بنصحى', 'AM'], ['الكرتون بالليل', 'PM']];
        const [t, a] = acts[rnd(0, acts.length - 1)];
        return { q: `${t}… صباحاً ولا مساءً؟`, pic: `<div class="bigem">${S(a === 'AM' ? 'sun' : 'moon', 96)}</div>`, ans: a, opts: ['AM', 'PM'] };
      }
      const h = rnd(1, 12), m = [0, 30, 15, 45][rnd(0, n === 1 ? 2 : 3)];
      const ans = fmtT(h, m), o = new Set([ans]); while (o.size < 3) o.add(fmtT(rnd(1, 12), [0, 15, 30][rnd(0, 2)]));
      return { q: 'الساعة كام؟', pic: `<div class="bigclock">${clockSvg(h, m)}</div>`, ans, opts: shuffle([...o]) };
    }
    case 5: {
      const cm = rnd(2, 9);
      if (n >= 3) { const mm = rnd(1, 9); return { q: `${cm} cm و ${mm} mm = كام mm؟`, pic: `<div class="bigem">${S('ruler', 110)}</div>`, ans: cm * 10 + mm, opts: opts(cm * 10 + mm, [1, 10, 9]) }; }
      return { q: `القلم ده طوله كام سنتيمتر؟ ${ie('pencil')}`, pic: ruler({ cm: 10, line: [0, cm * 10], pts: [] }), ans: cm, opts: opts(cm, [1, 2]) };
    }
    case 6: {
      if (n >= 7) { const a = rnd(100, 899), b = a + (Math.random() < .5 ? rnd(1, 99) : -rnd(1, 99)); return { q: 'أنهي رقم أكبر؟', pic: `<div class="qrow nums"><b>${a}</b><i>؟</i><b>${b}</b></div>`, ans: Math.max(a, b), opts: shuffle([a, b]) }; }
      const h = rnd(1, 4), t = rnd(0, 9), o = rnd(0, 9), v = h * 100 + t * 10 + o;
      return { q: 'الرقم ده كام؟ (مئات وعشرات وآحاد)', pic: blocks({ h, t, o }), ans: v, opts: opts(v, [1, 10, 100]) };
    }
    case 7: {
      const L = n >= 2 ? rnd(1, 3) : 0, d = rnd(1, 9), ans = L * 10 + d;
      return { q: L ? 'كلهم كام ديسيلتر (dL)؟ كل لتر = 10' : `كام كوباية ديسيلتر؟ ${ie('cup')}`, pic: jugs({ L, dL: d }), ans, opts: opts(ans, [1, 10]) };
    }
    case 8: {
      const add = Math.random() < .5 || n === 1, a = rnd(100, 300), b = rnd(10, 99), ans = add ? a + b : a - b;
      return { q: add ? `${a} + ${b} = ؟` : `${a} − ${b} = ؟`, pic: `<div class="bigem">${S(add ? 'target' : 'cookie', 96)}</div>`, ans, opts: opts(ans, [1, 10, 100]) };
    }
    default: {
      if (n === 1) { const a = rnd(1, 9); return { q: `${a} + ؟ = 10  (أصحاب العشرة)`, pic: `<div class="qrow">${heap(a, 'dot_Blue')}<i>+</i><span class="eatme">؟</span></div>`, ans: 10 - a, opts: opts(10 - a, [1, 2]) }; }
      const a = rnd(11, 59), b = 9, add = Math.random() < .5, ans = add ? a + b : a - b;
      return { q: add ? `${a} + 9 = ؟  (زوّد 10 وشيل 1)` : `${a} − 9 = ؟  (شيل 10 وزوّد 1)`, pic: `<div class="bigem">${S('brain', 96)}</div>`, ans, opts: opts(ans, [1, 2, 10]) };
    }
  }
}

let G = null;
function openGame(id) {
  const l = allLessons.find(x => x.id === id); if (!l) return;
  const qs = []; let guard = 0;
  while (qs.length < 5 && guard++ < 50) { const q = makeQ(l); if (!qs.some(x => x.q === q.q && String(x.ans) === String(q.ans))) qs.push(q); }
  G = { l, qs, i: 0, score: 0, tries: 0 };
  let ov = document.getElementById('game'); if (!ov) { ov = document.createElement('div'); ov.id = 'game'; document.body.appendChild(ov); }
  ov.setAttribute('style', `--c:${CHC[l.ch.id]}`);
  ov.classList.add('on'); document.body.style.overflow = 'hidden';
  SFX.pop(); drawQ();
}
function closeGame() { const ov = document.getElementById('game'); ov?.classList.remove('on'); document.body.style.overflow = ''; G = null; }
function drawQ() {
  const ov = document.getElementById('game'), q = G.qs[G.i];
  const dots = G.qs.map((_, i) => `<i class="${i < G.i ? 'd' : i === G.i ? 'c' : ''}"></i>`).join('');
  ov.innerHTML = `<div class="gbox">
    <div class="gtop"><button class="gx" data-gclose aria-label="قفل">✕</button><div class="gdots">${dots}</div><div class="gmini">${IC.mascot}</div></div>
    <h2 class="gq">${q.q}</h2>
    <div class="gpic">${q.pic}</div>
    <div class="gopts">${q.opts.map((o, k) => `<button class="gopt o${k}" data-a="${esc(o)}">${SH[o] ? S(o, 54) : esc(o)}</button>`).join('')}</div>
  </div>`;
  G.tries = 0;
}
function answer(btn) {
  const q = G.qs[G.i];
  if (String(btn.dataset.a) === String(q.ans)) {
    if (G.tries === 0) { G.score++; window.onGameRight?.(btn); }
    btn.classList.add('ok'); const [x, y] = centerOf(btn); SFX.pop(); setTimeout(SFX.ding, 120); burst(x, y);
    document.querySelector('.gmini')?.classList.add('jump');
    document.querySelectorAll('.gopt').forEach(b => b.disabled = true);
    setTimeout(() => { G.i++; G.i < G.qs.length ? drawQ() : endGame(); }, 1100);
  } else {
    G.tries++; SFX.boing(); btn.classList.add('no'); btn.disabled = true;
  }
}
function endGame() {
  const ov = document.getElementById('game'), s = G.score, n = G.qs.length;
  const msg = s === n ? 'إنت شطّور بجد!' : s >= 3 ? 'برافو عليك!' : 'حلو أوي… يلا نلعب تاني؟';
  ov.innerHTML = `<div class="gbox gend">
    <div class="gtop"><button class="gx" data-gclose aria-label="قفل">✕</button></div>
    <div class="gbig">${IC.mascot}</div>
    <h2 class="gq">${msg}</h2>
    <div class="stars">${Array(n).fill(0).map((_, i) => `<span class="${i < s ? 'on' : ''}" style="animation-delay:${i * .15}s">${S(i < s ? 'star' : 'starOff', 50)}</span>`).join('')}</div>
    <p class="sub">${s} من ${n} من أول مرة</p>

  </div>`;
  SFX.boom(); setTimeout(SFX.win, 250); setTimeout(() => window.onGameEnd?.(s, n, G?.l), 700);
  burst(innerWidth / 2, innerHeight / 2.6, true); setTimeout(() => burst(innerWidth * .3, innerHeight / 3, true), 300); setTimeout(() => burst(innerWidth * .7, innerHeight / 3, true), 550);
}

/* ───────── events ───────── */
document.addEventListener('click', e => {
