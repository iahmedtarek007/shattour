<script>/* sheet.js */
/* Shattour — "ورقة تطبيق": one practice sheet per lesson, grouped by idea.
   Each idea gets questions shaped like its own worked example (new numbers, same pattern),
   then the tricky ideas, then the book's own questions. Printable, regenerable. */

/* seeded random so screen and print match until "new questions" */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = arr => arr[ri(0, arr.length - 1)];
const SEEDS = JSON.parse(localStorage.getItem('mm-sheet-seeds') || '{}');
const seedFor = id => SEEDS[id] ?? ([...id].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) >>> 0);

/* number with same length and same trailing zeros as n */
function like(n) {
  const s = String(n), z = (s.match(/0+$/) || [''])[0].length, len = s.length;
  if (len === 1) return ri(n === 0 ? 0 : 2, 9);
  const core = len - z; let c = String(ri(1, 9)); for (let i = 1; i < core; i++) c += ri(0, 9);
  return +(c + '0'.repeat(z));
}
const pattern = (a, b, add) => {
  const da = [...String(a)].reverse().map(Number), db = [...String(b)].reverse().map(Number); let p = '', c = 0;
  for (let i = 0; i < Math.max(da.length, db.length); i++) {
    if (add) { const s = (da[i] || 0) + (db[i] || 0) + c; c = s >= 10 ? 1 : 0; p += c; }
    else { let x = (da[i] || 0) - c, y = db[i] || 0; c = x < y ? 1 : 0; p += c; }
  }
  return p;
};

/* ───────── per-visual question makers: return [{p, vis, ans}] ───────── */
const vbox = (a, op, b) => `<div class="sv ltr"><div>${a}</div><div><b>${op}</b>${b}</div><i></i><div class="bl">&nbsp;</div></div>`;
const GEN = {
  v(e) {
    const a0 = +e.a, b0 = +e.b, add = e.op === '+', pat = pattern(a0, b0, add), out = [];
    for (let k = 0; k < 2; k++) {
      let a, b, g = 0;
      do { a = like(a0); b = like(b0); if (!add && b > a) [a, b] = [b, a]; g++; }
      while (g < 400 && (pattern(a, b, add) !== pat || (!add && (a - b < 0 || String(a).length !== String(a0).length)) || (a === a0 && b === b0) || out.some(q => q.key === a + '|' + b)));
      out.push({ key: a + '|' + b, p: add ? 'اجمع رأسي:' : 'اطرح رأسي:', vis: vbox(a, add ? '+' : '−', b), ans: String(add ? a + b : a - b) });
    }
    return out;
  },
  wrong(e) {
    const P = 'صحّح الغلط: ده حل غلط… الصح كام؟', W = (a, op, b, bad) => `<div class="swrong ltr">${a} ${op} ${b} = <s>${bad}</s> ✗</div>`;
    let a, b;
    if (e.q.includes('−')) {               // forgot to lower the tens after borrowing
      do { a = ri(31, 92); b = ri(12, a - 10); } while (a % 10 >= b % 10);
      const bad = (Math.floor(a / 10) - Math.floor(b / 10)) * 10 + (a % 10 + 10 - b % 10);
      return [{ p: P, vis: W(a, '−', b, bad), ans: String(a - b) }];
    }
    const [, x, y] = e.q.match(/(\d+)\s*\+\s*(\d+)/) || [];
    if (y && y.length === 1) {              // mental math: treated the tens digit as ones
      do { a = ri(21, 68); b = ri(4, 9); } while (a % 10 + b < 10);
      return [{ p: P, vis: W(a, '+', b, Math.floor(a / 10) + a % 10 + b), ans: String(a + b) }];
    }
    do { a = ri(12, 68); b = ri(11, 29); } while ((a % 10 + b % 10) < 10 || a + b > 99);   // forgot to carry
    return [{ p: P, vis: W(a, '+', b, `${Math.floor(a / 10) + Math.floor(b / 10)}${a % 10 + b % 10}`), ans: String(a + b) }];
  },
  blocks(e) {
    const h = e.h ? ri(1, 4) : 0, t = ri(1, 6), o = ri(1, 8);
    return [{ p: 'اكتب الرقم:', vis: blocks({ h, t, o }), ans: String(h * 100 + t * 10 + o) }];
  },
  pv(e) {
    if (e.t === 10 || e.o === 10) {
      const h = ri(1, 7), t = e.t === 10 ? 10 : ri(1, 8), o = e.o === 10 ? 10 : ri(1, 8);
      return [{ p: `${h} hundreds, ${t} tens, ${o} ones = <i class="blank"></i>`, vis: '', ans: String(h * 100 + t * 10 + o) }];
    }
    const n = ri(1, 9) * 100 + (R() < .35 ? 0 : ri(1, 9)) * 10 + ri(0, 9);
    return [{ p: `الرقم <b class="ltr">${n}</b> = <i class="blank sm"></i> hundreds , <i class="blank sm"></i> tens , <i class="blank sm"></i> ones`, vis: '', ans: `${Math.floor(n / 100)} , ${Math.floor(n % 100 / 10)} , ${n % 10}` }];
  },
  pvop(e) {
    const add = e.op === '+', a = ri(2, 8) * 100 + (add ? 0 : ri(1, 9) * 10), b = add ? ri(1, 9) * 10 : a % 100;
    return [{ p: 'احسب:', vis: `<div class="sline ltr">${a} ${add ? '+' : '−'} ${b} = <i class="blank"></i></div>`, ans: String(add ? a + b : a - b) }];
  },
  nline(e) {
    const span = e.to - e.from, base = Math.max(0, e.from + ri(-3, 6) * 10 * (span >= 30 ? 1 : 1)) ;
    const from = Math.round(base / 10) * 10, to = from + span, labels = e.labels.map(v => v - e.from + from);
    const ticks = []; for (let v = from; v <= to; v += e.minor) if (!labels.includes(v)) ticks.push(v);
    if (ticks.length < 3) return [];
    const pts = []; while (pts.length < 3) { const v = pick(ticks); if (!pts.includes(v)) pts.push(v); } pts.sort((x, y) => x - y);
    return [{ p: 'اكتب الأرقام اللي عند (a) و (b) و (c):', vis: nline({ from, to, minor: e.minor, labels, marks: { a: pts[0], b: pts[1], c: pts[2] } }).replace(/<text x="[\d.]+" y="116"[^>]*>\d+<\/text>/g, ''), ans: `a = ${pts[0]} , b = ${pts[1]} , c = ${pts[2]}` }];
  },
  ruler(e) {
    if (e.pts && e.pts.length === 3 && e.showv) {
      const mx = e.cm * 10, v = [ri(2, 9), ri(11, 29), ri(31, mx - 2)];
      return [{ p: 'كام mm عند كل سهم؟', vis: ruler({ cm: e.cm, pts: [['A', v[0]], ['B', v[1]], ['C', v[2]]] }), ans: v.map((x, i) => `${'ABC'[i]} = ${x >= 10 ? Math.floor(x / 10) + ' cm ' + (x % 10) + ' mm' : x + ' mm'}`).join(' , ') }];
    }
    if (e.line && e.line[0] > 0) {
      const s = ri(1, 3), L = ri(4, 8);
      return [{ p: 'القلم مش بادئ من الصفر… طوله كام cm؟', vis: ruler({ cm: 12, line: [s * 10, (s + L) * 10], pts: [['s', s * 10], ['e', (s + L) * 10]] }), ans: `${s + L} − ${s} = ${L} cm` }];
    }
    const L = ri(2, 9), mm = e.cm <= 8 && e.line && e.line[1] % 10 ? ri(1, 9) : 0;
    return [{ p: mm ? `ارسم خط طوله ${L} cm و ${mm} mm على المسطرة.` : 'الخط ده طوله كام سنتيمتر؟', vis: mm ? '' : ruler({ cm: 10, line: [0, L * 10], pts: [] }), ans: mm ? `من 0 لحد ${L}.${mm}` : `${L} cm` }];
  },
  clocks(e) {
    if (e.arrow) { const h = ri(1, 11), add = pick([15, 30]); return [{ p: `الساعة دي… بعد ${add} دقيقة هتبقى كام؟`, vis: `<div class="sclk">${clock(h, 0, '')}</div>`, ans: `${h}:${add}` }]; }
    const h = ri(1, 12), m = pick([0, 15, 30, 45]);
    return [{ p: 'الساعة كام؟', vis: `<div class="sclk">${clock(h, m, '')}</div>`, ans: `${h}:${String(m).padStart(2, '0')}` }];
  },
  daybar() {
    const acts = [['بنروح المدرسة الساعة 7', 'AM'], ['بنتعشى الساعة 8', 'PM'], ['بنصحى الساعة 6', 'AM'], ['بننام الساعة 9', 'PM']];
    const [a, b] = [acts.splice(ri(0, 3), 1)[0], pick(acts)];
    return [{ p: `${a[0]} … AM ولا PM؟`, vis: '', ans: a[1] }, { p: `${b[0]} … AM ولا PM؟`, vis: '', ans: b[1] }];
  },
  jugs(e) {
    const L = e.L ? ri(1, 3) : 0, d = ri(2, 9);
    return [{ p: L ? 'كلهم كام dL؟ (كل لتر = 10 dL)' : 'كام dL؟', vis: jugs({ L, dL: d }), ans: `${L * 10 + d} dL` }];
  },
  unitsum(e) {
    const add = e.op === '+', [u0, u1] = e.u; let a1, a2, b1, b2;
    do { a1 = ri(3, 20); a2 = ri(1, 9); b1 = ri(1, add ? 15 : a1 - 1); b2 = ri(1, 9); } while (add ? a2 + b2 >= 10 : (a2 < b2 || b1 >= a1));
    return [{ p: 'احسب:', vis: `<div class="sline ltr">${a1} ${u0}, ${a2} ${u1} ${add ? '+' : '−'} ${b1} ${u0}, ${b2} ${u1} = <i class="blank"></i></div>`, ans: `${add ? a1 + b1 : a1 - b1} ${u0}, ${add ? a2 + b2 : a2 - b2} ${u1}` }];
  },
  cmp(e) {
    const first = e.items[0][0];
    const sign = (x, y) => x > y ? '>' : x < y ? '<' : '=';
    if (/L|dL|mL/.test(first)) {
      const L = ri(1, 5), d = ri(5, 60); return [{ p: 'حط العلامة (> < =):', vis: `<div class="sline ltr">${L} L <i class="blank"></i> ${d} dL</div>`, ans: sign(L * 10, d) }];
    }
    if (/[−+]/.test(first)) {
      const a = ri(2, 9) * 100, b = ri(1, 9) * 10, c = ri(1, 9) * 100; return [{ p: 'احسب الأول وبعدين حط العلامة:', vis: `<div class="sline ltr">${a} − ${b} <i class="blank"></i> ${c}</div>`, ans: sign(a - b, c) }];
    }
    const out = []; for (let k = 0; k < 2; k++) { const a = like(+first || 345), b = R() < .5 ? a + ri(-9, 9) : like(a); out.push({ p: 'حط العلامة (> < =):', vis: `<div class="sline ltr">${a} <i class="blank"></i> ${b}</div>`, ans: sign(a, b) }); }
    return out;
  },
  conv(e) {
    const F = { 'cm>mm': 10, 'L>dL': 10, 'dL>mL': 100, 'L>mL': 1000 };
    for (const [l, r] of e.items) {
      const m1 = l.match(/^1 (\w+)$/), m2 = r.match(/^(\d+) (\w+)/);
      if (m1 && m2 && F[m1[1] + '>' + m2[2]]) { const k = ri(2, 9), f = F[m1[1] + '>' + m2[2]]; return [{ p: 'كمّل:', vis: `<div class="sline ltr">${k} ${m1[1]} = <i class="blank"></i> ${m2[2]}</div>`, ans: `${k * f} ${m2[2]}` }]; }
    }
    if (e.items.every(([, r]) => /^(cm|mm|L|dL|mL)$/.test(r))) { const [l, r] = pick(e.items); return [{ p: `<span class="ltr">${l}</span> بيتقاس بإيه؟ (${[...new Set(e.items.map(i => i[1]))].join(' / ')})`, vis: '', ans: r }]; }
    return [];
  },
  bar(e) {
    const tot = ri(30, 70), p = ri(11, tot - 10), [L0] = e.parts[0], [L1] = e.parts[1];
    return [{ p: `${e.total[0]} = ${tot}، ${L0} = ${p}. كام ${L1}؟ واتأكد بالجمع.`, vis: bar({ total: [e.total[0], tot], parts: [[L0, p], [L1, tot - p]], q: 1 }), ans: `${tot} − ${p} = ${tot - p}  ✓ ${tot - p} + ${p} = ${tot}` }];
  },
  split(e) {
    const add = e.op === '+'; let a, b;
    if (add) { do { a = ri(13, 59); b = ri(4, 9); } while (a % 10 + b < 10 || a % 10 === 0); }
    else { do { a = ri(21, 75); b = ri(4, 9); } while (a % 10 >= b || a % 10 === 0); }
    return [{ p: add ? 'كمّل للعشرة واحسب في دماغك:' : 'انزل للعشرة واحسب في دماغك:', vis: `<div class="sline ltr">${a} ${add ? '+' : '−'} ${b} = <i class="blank"></i></div>`, ans: String(add ? a + b : a - b) }];
  },
  flow(e) {
    const line = e.lines.find(l => { const x = l.split('=')[0].trim(); return /^[\d\s+−()]+$/.test(x) && /\d\s*\)?\s*[+−]\s*\(?\s*\d/.test(x); });
    if (!line) return [];
    const expr = line.split('=')[0].trim(); let out = [];
    for (let k = 0; k < 2; k++) {
      let txt, val, g = 0;
      do { txt = expr.replace(/\d+/g, m => like(+m)); try { val = Function('return ' + txt.replace(/−/g, '-'))(); } catch { val = -1; } g++; }
      while (g < 200 && (!(val >= 0) || out.some(q => q.vis.includes(txt))));
      if (val >= 0) out.push({ p: 'احسب:', vis: `<div class="sline ltr">${txt} = <i class="blank"></i></div>`, ans: String(val) });
    }
    return out;
  },
  pict(e) { return chartQ(e.cols.length); },
  pict2() { return chartQ(4, true); },
  table(e) { return e.rows[0][0] === 'Vehicle' || e.rows[0][0] === 'The Game' || e.rows[0][0] === 'Fruit' ? chartQ(4) : []; },
};
function chartQ(n, two) {
  const kinds = ['apple', 'banana', 'strawberry', 'orange', 'car', 'ball'].sort(() => R() - .5).slice(0, Math.min(n, 4)), AN = { apple: 'التفاح', banana: 'الموز', strawberry: 'الفراولة', orange: 'البرتقال', car: 'العربيات', ball: 'الكور' };
  let c; do { c = kinds.map(() => ri(1, 7)); } while (new Set(c).size < c.length);
  const chart = `<div class="ecols">${kinds.map((k, i) => `<div class="ecol"><div class="estack">${Array(c[i]).fill(S(k, 24)).join('')}</div><small class="cname">${NAMES[k]?.[0] || ''}<br><span class="ltr">${NAMES[k]?.[1] || ''}</span></small></div>`).join('')}</div>`;
  const mx = kinds[c.indexOf(Math.max(...c))], mn = kinds[c.indexOf(Math.min(...c))];
  const [i, j] = [0, 1];
  if (two) {
    const c2 = kinds.map(() => ri(1, 7)), chart2 = `<div class="ecols">${kinds.map((k, x) => `<div class="ecol"><div class="estack">${Array(c2[x]).fill(S(k, 24)).join('')}</div><small class="cname">${NAMES[k]?.[0] || ''}<br><span class="ltr">${NAMES[k]?.[1] || ''}</span></small></div>`).join('')}</div>`;
    return [{ p: `كام ${S(kinds[0], 26, 'inl')} في المجموعتين مع بعض؟`, vis: `<div class="two"><small>Group 1</small>${chart}<small>Group 2</small>${chart2}</div>`, ans: `${c[0]} + ${c2[0]} = ${c[0] + c2[0]}` }];
  }
  return [
    { p: 'مين الأكتر؟ ومين الأقل؟', vis: chart, ans: `الأكتر ${AN[mx]} — الأقل ${AN[mn]}` },
    { p: `الفرق بين ${S(kinds[i], 26, 'inl')} و ${S(kinds[j], 26, 'inl')} كام؟ (بص على الرسمة فوق)`, vis: '', ans: `${Math.max(c[i], c[j])} − ${Math.min(c[i], c[j])} = ${Math.abs(c[i] - c[j])}` },
  ];
}

function ideaQs(it) {
  let qs = [];
  for (const e of it.ex) { const g = GEN[e.k]; if (g) qs = qs.concat(g(e)); if (qs.length >= 2) break; }
  return qs.slice(0, 2);
}
function buildSheet(l) {

  l.ideas.forEach((it, i) => groups.push({ n: String(i + 1), t: it.t, qs: ideaQs(it) }));
  l.tricky.forEach(it => groups.push({ n: '!', hard: true, t: it.t, qs: ideaQs(it) }));
  const book = (l.practice || []).map(([q, a]) => ({ p: `<span${/[؀-ۿ]/.test(q) ? '' : ' class="ltr"'}>${esc(q)}</span>`, vis: '', ans: a }));
  // ideas that got nothing borrow a book question; if none left, an oral one
  groups.forEach(g => { if (!g.qs.length) g.qs = book.length ? [book.shift()] : [{ p: `${S('chat', 26, 'inl')} اشرح لماما بكلامك: «${esc(g.t)}»`, vis: '', ans: 'شفهي' }]; });
  if (book.length) groups.push({ n: '★', book: true, t: 'من الكتاب', qs: book });
  R = Math.random;
  let k = 0;
  const total = groups.reduce((a, g) => a + g.qs.length, 0);
  return `<section class="sheet" id="sheet"${cst(l.ch.id)}>
    <div class="shhead">
      <div><div class="shtag">${S('pencil', 22, 'inl')} ورقة تطبيق</div><h2>${esc(l.ar)}</h2><p class="sub"><span class="ltr">${esc(l.en)}</span> · ${total} سؤال على كل أفكار الدرس</p></div>
      <div class="shbtns noprint"><button class="shb p pr" data-print="${l.id}">${S('print', 20, 'inl')} اطبعي الورقة</button><button class="shb pr" data-print="${l.id}" data-key="1">${S('print', 20, 'inl')} بالإجابات</button><button class="shb" data-reseed="${l.id}">${S('refresh', 20, 'inl')} أسئلة جديدة</button><button class="shb" data-allans>${S('eye', 20, 'inl')} كل الإجابات</button></div>
    </div>
    <div class="shname"><span>الاسم: ..............................</span><span>التاريخ: ..............</span><span>${S('star', 18, 'inl')} ..... / ${total}</span></div>
    ${groups.map(g => `<div class="sgrp ${g.hard ? 'hard' : ''} ${g.book ? 'book' : ''}">
      <div class="sgh"><i>${g.n}</i><b>${g.book ? 'أسئلة من الكتاب' : (g.hard ? 'فكرة صعبة: ' : 'الفكرة ' + g.n + ': ') + mk(g.t)}</b></div>
      <div class="sqs">${g.qs.map(q => `<div class="sq"><span class="sqn">${++k}</span><div class="sqb"><div class="sqp">${q.p}</div>${q.vis ? `<div class="sqv">${q.vis}</div>` : ''}<div class="sqa"><span class="lineans">الإجابة: <u></u></span><button class="noprint" data-ans>شوفي الإجابة</button><b class="ansv ltr">${esc(q.ans)}</b><button class="noprint okb" data-right="${l.id}|${seedFor(l.id)}|${k}">حلّها صح  +5</button></div></div></div>`).join('')}</div>
    </div>`).join('')}
  </section>`;
}

/* place: notes → sheet → game (practice moved into the sheet) */
const _lesson2 = lesson;
lesson = function (l) {
  let h = _lesson2(l);
  const cut = (html, start) => { const i = html.indexOf(start); if (i < 0) return [html, '']; const j = html.indexOf('</section>', i) + 10; return [html.slice(0, i) + html.slice(j), html.slice(i, j)]; };

};

<script>/* play.js */
/* Shattour — points, levels, streak, medals; new home and chapter path. */

/* ───────── state ───────── */
const PKEY = 'mm-play';
const P = Object.assign({ pts: 0, streak: 0, last: '', games: 0, perfect: 0, sheet: 0, gameDay: '', got: {}, medals: [], lessonPts: [] }, JSON.parse(localStorage.getItem(PKEY) || '{}'));
const saveP = () => localStorage.setItem(PKEY, JSON.stringify(P));
const today = () => new Date().toISOString().slice(0, 10);
(function streak() {
  const t = today(); if (P.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  P.streak = P.last === y ? P.streak + 1 : 1; P.last = t; saveP();
})();
const LV = 150;
const level = () => 1 + Math.floor(P.pts / LV);
const lvlPct = () => Math.round((P.pts % LV) / LV * 100);

const MEDALS = [
  { id: 'l1', t: 'أول درس', d: 'خلصتوا أول درس', ic: 'book', c: '#3D7CC9', ok: () => DONE.size >= 1 },
  { id: 'g1', t: 'أول لعبة', d: 'لعبتوا أول لعبة', ic: 'balloon', c: '#9A5CB4', ok: () => P.games >= 1 },
  { id: 'pf', t: 'لعبة كاملة', d: '5 من 5 من أول مرة', ic: 'star', c: '#C08A1E', ok: () => P.perfect >= 1 },
  { id: 'l5', t: '5 دروس', d: 'خلصتوا 5 دروس', ic: 'trophy', c: '#2E8B78', ok: () => DONE.size >= 5 },
  { id: 'ch', t: 'فصل كامل', d: 'خلصتوا فصل كله', ic: 'medal', c: '#4C9A3E', ok: () => BOOK.some(c => c.lessons.every(l => DONE.has(l.id))) },
  { id: 's3', t: '3 أيام', d: '3 أيام ورا بعض', ic: 'flame', c: '#E08A2E', ok: () => P.streak >= 3 },
  { id: 'sh', t: 'بطل الورقة', d: '10 أسئلة صح في الورق', ic: 'pencil', c: '#2A93B5', ok: () => P.sheet >= 10 },
  { id: 'p500', t: '500 نقطة', d: 'جمعتوا 500 نقطة', ic: 'gem', c: '#5A63C8', ok: () => P.pts >= 500 },
];
function medalSvg(m, on, size = 64) {
  return `<span class="mdl ${on ? 'on' : ''}" style="--mc:${m.c};width:${size}px;height:${size}px">${on ? S(m.ic, size * .5) : S('lock', size * .42)}</span>`;
}

/* ───────── awarding ───────── */
function coin() { tone(988, 988, .08, 'square', .08); tone(1318, 1318, .22, 'square', .08, .08); }
function award(n, from, why) {
  if (!n) return;
  P.pts += n; saveP();
  const pill = document.getElementById('ptsPill');
  const [x, y] = from ? centerOf(from) : [innerWidth / 2, innerHeight / 2];
  const f = document.createElement('div'); f.className = 'flyp'; f.innerHTML = `${S('star', 26)}<b>+${n}</b>`;
  f.style.left = x + 'px'; f.style.top = y + 'px'; document.body.appendChild(f);
  if (pill) { const [tx, ty] = centerOf(pill); f.animate([{ transform: 'translate(-50%,-50%) scale(1)' , offset: 0 }, { transform: 'translate(-50%,-150%) scale(1.25)', offset: .3 }, { transform: `translate(calc(${tx - x}px - 50%),calc(${ty - y}px - 50%)) scale(.6)`, opacity: .2 }], { duration: 1000, easing: 'cubic-bezier(.5,0,.5,1)', fill: 'forwards' }); }
  setTimeout(() => { f.remove(); coin(); paintPills(true); }, 980);
  if (why) toast(`${S('star', 22, 'inl')} <b>+${n}</b> ${why}`);
  setTimeout(checkMedals, 1100);
}
function checkMedals() {
  for (const m of MEDALS) if (!P.medals.includes(m.id) && m.ok()) { P.medals.push(m.id); saveP(); showMedal(m); break; }
}
function showMedal(m) {
  const ov = document.createElement('div'); ov.className = 'mpop';
  ov.innerHTML = `<div class="mcard">${medalSvg(m, true, 120)}<small>ميدالية جديدة!</small><h2>${m.t}</h2><p>${m.d}</p><button class="cta" data-mclose>هيييه!</button></div>`;
  document.body.appendChild(ov); SFX.boom(); setTimeout(SFX.win, 200); burst(innerWidth / 2, innerHeight / 2.4, true);
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-mclose]')) { ov.remove(); if (location.hash === '' || location.hash === '#home') render(); setTimeout(checkMedals, 350); } });
}
let tT; function toast(html) {
  let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.innerHTML = html; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2200);
}

/* hooks from the game and the sheet */
window.onGameRight = btn => award(10, btn);
window.onGameEnd = (s, n, l) => {
  P.games++; if (s === n) P.perfect++;
  let bonus = s === n ? 25 : 0, why = s === n ? 'لعبة كاملة!' : '';
  if (P.gameDay !== today()) { P.gameDay = today(); bonus += 20; why = (why ? why + ' + ' : '') + 'تحدي النهارده'; }
  saveP(); if (bonus) award(bonus, document.querySelector('.stars'), why); else checkMedals();
  const sub = document.querySelector('.gend .sub'); if (sub) sub.insertAdjacentHTML('afterend', `<div class="gpts">${S('star', 26)} كسبت <b>${s * 10 + bonus}</b> نقطة</div>`);
};
document.addEventListener('click', e => {
  const r = e.target.closest('[data-right]');
  if (r) { if (!P.got[r.dataset.right]) { P.got[r.dataset.right] = 1; P.sheet++; award(5, r); } r.textContent = 'برافو ✓'; r.disabled = true; r.classList.add('done'); SFX.pop(); return; }
  if (e.target.closest('#doneBtn')) {
    const id = routeParts()[1];
    setTimeout(() => { if (DONE.has(id) && !P.lessonPts.includes(id)) { P.lessonPts.push(id); saveP(); award(50, document.getElementById('doneBtn'), 'خلصتوا الدرس'); } }, 60);
  }
});

/* ───────── top bar pills ───────── */
function paintPills(bump) {
  const ts = document.querySelector('.tstats'); if (!ts) return;
  ts.innerHTML = `<span class="tstat pf" title="أيام ورا بعض">${S('flame', 22)}<b class="ltr">${P.streak}</b></span>
    <span class="tstat pp ${bump ? 'bump' : ''}" id="ptsPill" title="النقط">${S('star', 22)}<b class="ltr">${P.pts}</b></span>
    <span class="tstat pl" title="المستوى">${S('medal', 22)}<b>مستوى ${level()}</b></span>`;
}
const _shell3 = shell;
shell = function (r) { _shell3(r); paintPills(); };

<script>/* fun.js */
/* Shattour — "fun" pass: white background, Duolingo-style chunky cards and buttons,
   and a pick → check → feedback game. Loaded last. */

/* ───────── game: pick, then check ───────── */
let PICK = null, GPTS = 0;
const _openGame = openGame;
openGame = function (id) { GPTS = 0; _openGame(id); };

drawQ = function () {
  const ov = document.getElementById('game'), q = G.qs[G.i];
  const pct = Math.round(G.i / G.qs.length * 100);
  const isPic = q.opts.every(o => SH[o]);
  PICK = null;
  ov.innerHTML = `<div class="gbox duo">
    <div class="gtop2">
      <button class="gx2" data-gclose aria-label="قفل"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="gprog"><i style="transform:scaleX(${Math.max(pct, 4) / 100})"></i></div>
      <span class="gptsc">${S('star', 26)}<b class="ltr">${GPTS}</b></span>
    </div>
    <div class="gtag">${S('balloon', 22)} سؤال ${G.i + 1} من ${G.qs.length}</div>
    <h2 class="gq2">${q.q}</h2>
    ${q.pic ? `<div class="gpic2">${q.pic}</div>` : ''}
    <div class="gopts2 ${isPic ? 'pics' : ''} n${q.opts.length}">${q.opts.map(o => `<button class="gopt2" data-a="${esc(o)}">${SH[o] ? `<span class="optpic">${S(o, 80)}${NAMES[o] ? `<b>${NAMES[o][0]}</b><small class="ltr">${NAMES[o][1]}</small>` : ''}</span>` : `<span class="ltr">${esc(o)}</span>`}</button>`).join('')}</div>
    <div class="gfoot"><button class="gcheck" data-gcheck disabled>تأكد</button></div>
  </div>`;
};
answer = function () {}; // old one-tap path is replaced by pick + check

function checkPick() {
  const q = G.qs[G.i], ok = String(PICK.dataset.a) === String(q.ans);
  document.querySelectorAll('.gopt2').forEach(b => {
    b.disabled = true;
    if (String(b.dataset.a) === String(q.ans)) b.classList.add('right');
    else if (b === PICK) b.classList.add('miss');
  });
  const foot = document.querySelector('.gfoot');
  if (ok) {
    G.score++; GPTS += 10; window.onGameRight?.(PICK);
    SFX.pop(); setTimeout(SFX.ding, 120); const [x, y] = centerOf(PICK); burst(x, y);
    foot.className = 'gfoot good';
    foot.innerHTML = `<div class="fb"><span class="fbi">${IC.check}</span><div><b>${pick(['برافو!', 'شطّور!', 'عظيم!', 'صح كده!'])}</b><small>+10 نقط</small></div><span class="fbm">${IC.mascot}</span></div><button class="gnext" data-gnext>كمّل</button>`;
  } else {
    SFX.boing();
    const right = SH[q.ans] ? S(q.ans, 30, 'inl') : `<b class="ltr">${esc(q.ans)}</b>`;
    foot.className = 'gfoot near';
    foot.innerHTML = `<div class="fb"><span class="fbi">${S('target', 30)}</span><div><b>قربت!</b><small>الإجابة الصح: ${right}</small></div></div><button class="gnext" data-gnext>كمّل</button>`;
  }
  const s = document.querySelector('.gptsc b'); if (s) s.textContent = GPTS;
}
document.addEventListener('click', e => {
  const o = e.target.closest('.gopt2');
  if (o && !o.disabled) { document.querySelectorAll('.gopt2').forEach(b => b.classList.remove('sel')); o.classList.add('sel'); PICK = o; SFX.tick(); document.querySelector('.gcheck').disabled = false; return; }
  if (e.target.closest('[data-gcheck]') && PICK) { checkPick(); return; }
  if (e.target.closest('[data-gnext]')) { SFX.tick(); G.i++; G.i < G.qs.length ? drawQ() : endGame(); }
});
addEventListener('keydown', e => {
  if (!G) return;
  if (e.key === 'Enter') { const n = document.querySelector('[data-gnext]'); if (n) n.click(); else if (PICK) checkPick(); }
});

<script>/* solve.js */
/* Shattour — "حلّ الورقة لوحدك": the child solves the lesson's sheet alone on any device,
   one question per screen, number pad / choice buttons, then a result screen for mum. */

P.sres = P.sres || {};
let SV = null;

/* turn a sheet answer into something the child can enter */
function ansSpec(raw) {
  const a = String(raw).trim();
  const num = s => s.match(/\d+/g);
  if (/^\d+$/.test(a)) return { type: 'num', fields: [{ v: a }] };
  if (/^[<>=]$/.test(a)) return { type: 'choice', opts: ['>', '<', '='], right: a };
  if (/^(AM|PM)$/.test(a)) return { type: 'choice', opts: ['AM', 'PM'], right: a };
  if (/^(cm|mm)$/.test(a)) return { type: 'choice', opts: ['cm', 'mm'], right: a };
  if (/^(L|dL|mL)$/.test(a)) return { type: 'choice', opts: ['L', 'dL', 'mL'], right: a };
  if (/^\d{1,2}:\d{2}$/.test(a)) {
    const [h, m] = a.split(':').map(Number), alt = new Set([a]);
    const f = (H, M) => `${((H + 11) % 12) + 1}:${String((M + 60) % 60).padStart(2, '0')}`;
    alt.add(f(h, m + 15)); alt.add(f(h + 1, m)); if (alt.size < 3) alt.add(f(h - 1, m));
    return { type: 'choice', opts: [...alt].slice(0, 3).sort(), right: a };
  }
  if (/^\d+\s*,\s*\d+$/.test(a)) { const n = num(a); return { type: 'num', fields: [{ v: n[0] }, { v: n[1] }] }; }
  const ap = a.match(/^(\d{1,2})\s*(AM|PM)$/); if (ap) { const h = +ap[1]; return { type: 'choice', opts: [`${h === 1 ? 12 : h - 1} ${ap[2]}`, a, `${h === 12 ? 1 : h + 1} ${ap[2]}`], right: a }; }
  if (/^\d+\s*✓/.test(a)) return { type: 'num', fields: [{ v: num(a)[0] }] };
  const lab = [...a.matchAll(/\b([a-cA-C])\s*=\s*(\d+)/g)];
  if (lab.length >= 2) return { type: 'num', fields: lab.map(m => ({ lab: m[1], v: m[2] })) };
  if (/^\d+\s*,\s*\d+\s*,\s*\d+$/.test(a)) { const n = num(a); return { type: 'num', fields: [{ lab: 'hundreds', v: n[0] }, { lab: 'tens', v: n[1] }, { lab: 'ones', v: n[2] }] }; }
  const units = [...a.matchAll(/(\d+)\s*(hours?|min(?:utes)?|cm|mm|dL|mL|L|tens)\b/g)];
  if (units.length >= 2 && !/[=+−✓]/.test(a)) return { type: 'num', fields: units.map(m => ({ v: m[1], unit: m[2] })) };
  let core = a.split('✓')[0];
  if (core.includes('=')) { const tail = core.split('=').pop(); const n = num(tail); if (n && n.length === 1 && !/[A-Za-z؀-ۿ]{3,}/.test(tail.replace(/(pounds?|cm|mm|dL|mL|L|min|hours?|years|tens?)/g, ''))) return { type: 'num', fields: [{ v: n[0], unit: (tail.match(/[A-Za-z]+/) || [''])[0] }] }; }
  if (units.length === 1 && /^\d+\s*[A-Za-z]+$/.test(a)) return { type: 'num', fields: [{ v: units[0][1], unit: units[0][2] }] };
  const one = a.match(/^(\d+)\s+(pounds?|years|apples|stickers|candies|pupils|students)$/); if (one) return { type: 'num', fields: [{ v: one[1], unit: one[2] }] };
  return { type: 'self', show: a };
}

function openSolve(lid) {
  const sheet = document.getElementById('sheet'); if (!sheet) return;
  const qs = [...sheet.querySelectorAll('.sq')].map((q, k) => ({
    p: q.querySelector('.sqp').innerHTML, vis: q.querySelector('.sqv')?.innerHTML || '',
    ans: q.querySelector('.ansv').textContent, key: q.querySelector('[data-right]')?.dataset.right || (lid + '|' + k),
    group: q.closest('.sgrp')?.querySelector('.sgh b')?.textContent || '',
  }));
  SV = { lid, qs, i: 0, res: [], l: allLessons.find(x => x.id === lid) };
  let ov = document.getElementById('solve'); if (!ov) { ov = document.createElement('div'); ov.id = 'solve'; document.body.appendChild(ov); }
  ov.setAttribute('style', `--c:${CHC[SV.l.ch.id]}`); ov.classList.add('on'); document.body.style.overflow = 'hidden';
  SFX.pop(); drawSolve();
}
function closeSolve() { document.getElementById('solve')?.classList.remove('on'); document.body.style.overflow = ''; SV = null; render(); }

function drawSolve() {
  const ov = document.getElementById('solve'), q = SV.qs[SV.i], sp = ansSpec(q.ans);
  SV.sp = sp; SV.cur = 0; SV.vals = sp.type === 'num' ? sp.fields.map(() => '') : []; SV.pick = null; SV.done = false;
  const pct = SV.i / SV.qs.length;
  let body = '';
  if (sp.type === 'num') {
    body = `<div class="sfields ltr">${sp.fields.map((f, k) => `<label class="sfield ${k === 0 ? 'on' : ''}" data-f="${k}">${f.lab ? `<small>${f.lab}</small>` : ''}<b></b>${f.unit ? `<em>${f.unit}</em>` : ''}</label>`).join('')}</div>
      <div class="pad ltr">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'del', 0, 'ok'].map(k => k === 'del' ? `<button data-k="del" aria-label="امسح">⌫</button>` : k === 'ok' ? `<button data-k="ok" class="pok">تأكد</button>` : `<button data-k="${k}">${k}</button>`).join('')}</div>`;
  } else if (sp.type === 'choice') {
    body = `<div class="gopts2 n${sp.opts.length}">${sp.opts.map(o => `<button class="gopt2 sch" data-c="${esc(o)}"><span class="ltr">${esc(o)}</span></button>`).join('')}</div>
      <div class="gfoot"><button class="gcheck" data-scheck disabled>تأكد</button></div>`;
  } else {
    body = `<div class="selfbox"><p>حلّها في دماغك أو قولها لماما… وبعدين شوف الإجابة</p><button class="cta" data-sreveal>شوف الإجابة</button></div>`;
  }
  ov.innerHTML = `<div class="gbox duo sbox">
    <div class="gtop2"><button class="gx2" data-sclose aria-label="قفل"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="gprog"><i style="transform:scaleX(${Math.max(pct, .03)})"></i></div><span class="scount ltr">${SV.i + 1}/${SV.qs.length}</span></div>
    <div class="gtag">${S('pencil', 22)} ورقة تطبيق · ${esc(SV.l.ar)}</div>
    <h2 class="gq2">${q.p}</h2>
    ${q.vis ? `<div class="gpic2 svis">${q.vis}</div>` : ''}
    <div class="sanswer">${body}</div>
  </div>`;
}
function paintFields() {
  document.querySelectorAll('.sfield').forEach((f, k) => { f.classList.toggle('on', k === SV.cur); f.querySelector('b').textContent = SV.vals[k] || ''; });
}
function finishQ(ok, given) {
  if (SV.done) return; SV.done = true;
  const q = SV.qs[SV.i];
  SV.res.push({ ok, given, ans: q.ans, p: q.p.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim() });
  const box = document.querySelector('.sanswer');
  if (ok) {

document.addEventListener('click', e => {
  const o = e.target.closest('[data-solve]'); if (o) { e.preventDefault(); openSolve(o.dataset.solve); return; }
  if (!SV) return;
  if (e.target.closest('[data-sclose]')) { SFX.tick(); closeSolve(); return; }
  if (e.target.closest('[data-snext]')) { SFX.tick(); SV.i++; SV.i < SV.qs.length ? drawSolve() : solveResult(); return; }
  const f = e.target.closest('.sfield'); if (f) { SV.cur = +f.dataset.f; paintFields(); return; }
  const k = e.target.closest('.pad button');
  if (k && !k.disabled) {
    const v = k.dataset.k;
    if (v === 'ok') checkNum();
    else if (v === 'del') { SV.vals[SV.cur] = SV.vals[SV.cur].slice(0, -1); SFX.tick(); paintFields(); }
    else if (SV.vals[SV.cur].length < 5) { SV.vals[SV.cur] += v; SFX.tick(); paintFields(); document.querySelectorAll('.sfield')[SV.cur]?.classList.remove('need'); }
    return;
  }
  const c = e.target.closest('.sch');
  if (c && !c.disabled) { document.querySelectorAll('.sch').forEach(b => b.classList.remove('sel')); c.classList.add('sel'); SV.pick = c.dataset.c; document.querySelector('[data-scheck]').disabled = false; SFX.tick(); return; }
  if (e.target.closest('[data-scheck]') && SV.pick != null) {
    const ok = SV.pick === SV.sp.right;
    document.querySelectorAll('.sch').forEach(b => { if (b.dataset.c === SV.sp.right) b.classList.add('right'); else if (b.dataset.c === SV.pick) b.classList.add('miss'); });
    document.querySelector('.sanswer .gfoot')?.remove();
    finishQ(ok, SV.pick); return;
  }
  if (e.target.closest('[data-sreveal]')) {
    const box = document.querySelector('.selfbox');
    box.innerHTML = `<div class="selfans ltr">${esc(SV.sp.show)}</div><p>حلّيتها صح؟</p><div class="selfb"><button class="cta" data-self="1">${IC.check} أيوه صح</button><button class="btn s" data-self="0">لسه</button></div>`;
    SFX.pop(); return;

});
addEventListener('keydown', e => {
  if (!SV || SV.done && e.key !== 'Enter') return;
  if (SV.done && e.key === 'Enter') { document.querySelector('[data-snext]')?.click(); return; }
  if (SV.sp?.type !== 'num') { if (e.key === 'Enter') document.querySelector('[data-scheck]:not([disabled])')?.click(); return; }
  if (/^\d$/.test(e.key) && SV.vals[SV.cur].length < 5) { SV.vals[SV.cur] += e.key; paintFields(); }
  else if (e.key === 'Backspace') { SV.vals[SV.cur] = SV.vals[SV.cur].slice(0, -1); paintFields(); }
  else if (e.key === 'Tab' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); SV.cur = (SV.cur + 1) % SV.vals.length; paintFields(); }
  else if (e.key === 'Enter') checkNum();
  else if (e.key === 'Escape') closeSolve();
});

/* ───────── more pictures: written sums get a matching illustration ───────── */
const _visB = vis;
vis = function (e) {
  if (e.k === 'flow' && !e.noPic) {
    for (const raw of e.lines) {
      const line = raw.replace(/\[\[|\]\]/g, '');
      const m = line.match(/^\s*(\d+)\s*([+−-])\s*(\d+)\s*=\s*\d+/);
      if (!m) continue;
      const a = +m[1], b = +m[3], op = m[2] === '+' ? '+' : '-', r = op === '+' ? a + b : a - b;
      if (r < 0) break;
      if (a <= 99 && b <= 99 && r <= 199) return `<div class="vk vk-v vk-auto">${story({ a, op, b })}</div>` + _visB(e);
      if (a % 10 === 0 && b % 10 === 0 && a <= 999 && b <= 999 && r <= 999) return `<div class="vk vk-pvop vk-auto">${pvop({ a, op: op === '+' ? '+' : '−', b })}</div>` + _visB(e);
      break;
    }
  }
  return _visB(e);
};

/* the site is designed light: drop every dark-mode rule so phones in dark mode see the same calm white design */
(function stripDark() {
  for (const sh of document.styleSheets) {
    let rules; try { rules = sh.cssRules; } catch (e) { continue; }
    for (let i = rules.length - 1; i >= 0; i--) {
      const r = rules[i];
      if (r.media && /prefers-color-scheme:\s*dark/.test(r.media.mediaText)) { try { sh.deleteRule(i); } catch (e) {} }
    }
  }
  document.documentElement.style.colorScheme = 'light';
})();
